<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<link rel="dns-prefetch" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<title>Carrito y checkout — Autokeys Remaps Pro Store</title>
<meta name="description" content="Revisa tu pedido y completa el pago de forma segura en Autokeys Remaps Pro Store.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.autokeysremapspro.es/carrito.html">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>

<header id="site-header" data-active="carrito"></header>

<h1 class="visually-hidden">Carrito y checkout — Autokeys Remaps Pro Store</h1>

<div class="checkout-steps">
  <div class="cstep active"><b>1</b><span>CARRITO<small>Revisa tu pedido</small></span></div>
  <div class="cstep"><b>2</b><span>DATOS<small>Información personal</small></span></div>
  <div class="cstep"><b>3</b><span>PAGO<small>Método de pago</small></span></div>
  <div class="cstep"><b>4</b><span>CONFIRMACIÓN<small>Pedido completado</small></span></div>
</div>

<div id="cart-root"></div>

<footer id="site-footer"></footer>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/vendor/supabase-js-2.112.3.min.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  let payMethod = 'tarjeta';
  let CURRENT_USER = null;
  let PERFIL = null;
  let VEHICULOS = [];
  let selectedVehiculoId = '';
  let showNewVehiculoForm = false;
  let appliedCupon = null;

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data } = await akSupabase().auth.getUser();
      CURRENT_USER = data.user;
      if (CURRENT_USER) {
        const { data: perfil } = await akSupabase().from('tienda_clientes').select('*').eq('id', CURRENT_USER.id).maybeSingle();
        PERFIL = perfil;
        const { data: vehiculosData } = await akSupabase()
          .from('tienda_vehiculos')
          .select('*')
          .eq('cliente_id', CURRENT_USER.id)
          .order('created_at', { ascending: false });
        VEHICULOS = vehiculosData || [];
      }
    } catch (e) { /* supabase not reachable — treat as guest */ }
    await akCatalogReady();

    const params = new URLSearchParams(window.location.search);
    if (params.get('pago') === 'retorno' && params.get('pedido')) {
      showPaymentReturn(params.get('pedido'));
      return;
    }
    render();
  });

  async function showPaymentReturn(pedidoId) {
    document.querySelectorAll('.cstep').forEach((s, i) => s.classList.toggle('active', i === 3));
    document.getElementById('cart-root').innerHTML =
      '<div class="section"><div class="empty-state">' + akIcon('clock') + '<h3>Comprobando tu pago…</h3></div></div>';

    try {
      await fetch('/api/confirmar-pago', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pedido_id: pedidoId }),
      });
    } catch (e) {
      console.error('No se pudo confirmar el pago activamente, se muestra el último estado conocido:', e);
    }

    const { data: pedido } = await akSupabase().from('tienda_pedidos').select('numero, total, pago_estado').eq('id', pedidoId).maybeSingle();

    if (!pedido) {
      document.getElementById('cart-root').innerHTML =
        '<div class="section"><div class="empty-state">' + akIcon('checkCircle') +
        '<h3>Pedido recibido</h3><p>No hemos podido comprobar el estado del pago, pero tu pedido ha quedado registrado. Te contactaremos para confirmarlo.</p></div></div>';
      return;
    }

    if (pedido.pago_estado === 'pagado') {
      document.getElementById('cart-root').innerHTML =
        '<div class="section"><div class="empty-state">' + akIcon('checkCircle') +
        '<h3>¡Pago confirmado!</h3><p>Tu pedido <b style="color:#fff">#' + esc(pedido.numero) + '</b> por ' + akFormatPrice(Number(pedido.total)) + ' está pagado. Empezamos a prepararlo.</p>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="cuenta.html">Ver mis pedidos</a></div></div>';
    } else if (pedido.pago_estado === 'fallido') {
      document.getElementById('cart-root').innerHTML =
        '<div class="section"><div class="empty-state">' + akIcon('close') +
        '<h3>El pago no se ha completado</h3><p>Tu pedido <b style="color:#fff">#' + esc(pedido.numero) + '</b> ha quedado registrado, pero el pago no llegó a procesarse. Puedes escribirnos por WhatsApp para intentarlo de otra forma.</p>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="https://wa.me/34632982646" target="_blank" rel="noopener">Contactar por WhatsApp</a></div></div>';
    } else {
      document.getElementById('cart-root').innerHTML =
        '<div class="section"><div class="empty-state">' + akIcon('checkCircle') +
        '<h3>Pedido recibido</h3><p>Tu pedido <b style="color:#fff">#' + esc(pedido.numero) + '</b> ha quedado registrado. Estamos confirmando el pago — te avisaremos en cuanto se complete.</p></div></div>';
    }
  }

  function render() {
    const lines = akCartLines();
    if (lines.length === 0) {
      document.getElementById('cart-root').innerHTML =
        '<div class="section"><div class="empty-state">' + akIcon('cart') +
        '<h3>Tu carrito está vacío</h3><p>Añade algún servicio o producto desde la tienda para continuar.</p>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="tienda.html">Ir a la tienda</a></div></div>';
      return;
    }

    const subtotal = akCartSubtotal();
    const ivaPortion = subtotal - subtotal / 1.21;
    const descuento = cuponDescuento(subtotal);
    const total = subtotal - descuento;

    document.getElementById('cart-root').innerHTML =
    '<div class="cart-layout">' +
      '<div>' +
        '<div class="cart-panel">' +
          '<h3>RESUMEN DEL PEDIDO <span class="count">' + lines.length + (lines.length === 1 ? ' producto' : ' productos') + '</span></h3>' +
          '<div id="cart-items">' + lines.map(renderLine).join('') + '</div>' +
          '<a class="link-red" href="tienda.html" style="margin-top:6px;display:inline-flex">' + akIcon('chevLeft') + 'Seguir comprando</a>' +
          renderCrossSell(lines) +
          (appliedCupon
            ? '<div class="coupon-row"><span style="display:flex;align-items:center;gap:8px;font-size:13px"><b style="color:var(--red)">' + esc(appliedCupon.codigo) + '</b> aplicado</span><button class="btn btn-secondary" id="coupon-remove-btn">Quitar</button></div>'
            : '<div class="coupon-row">' +
              '<input type="text" id="coupon-input" placeholder="Introduce tu código de descuento">' +
              '<button class="btn btn-secondary" id="coupon-btn">Aplicar cupón</button>' +
            '</div>') +
          '<div class="totals">' +
            '<div class="row"><span>Subtotal</span><span>' + akFormatPrice(subtotal) + '</span></div>' +
            (descuento > 0 ? '<div class="row" style="color:var(--red)"><span>Descuento</span><span>−' + akFormatPrice(descuento) + '</span></div>' : '') +
            '<div class="row"><span>Envío</span><span>Gratis</span></div>' +
            '<div class="row"><span>IVA (21%, incluido)</span><span>' + akFormatPrice(ivaPortion) + '</span></div>' +
            '<div class="row total"><span>Total</span><span>' + akFormatPrice(total) + '</span></div>' +
          '</div>' +
          '<div class="notice">' + akIcon('truck') + '¡Envío gratis! Tu pedido incluye envío gratuito a toda España peninsular.</div>' +
          '<ul class="trust-row">' +
            '<li>' + akIcon('lock') + 'Pago 100% seguro</li>' +
            '<li>' + akIcon('shield') + 'Garantía hasta 24 meses</li>' +
            '<li>' + akIcon('headset') + 'Soporte experto 7 días</li>' +
            '<li>' + akIcon('award') + 'Más de 10 años de experiencia</li>' +
          '</ul>' +
        '</div>' +
      '</div>' +
      '<div>' + (CURRENT_USER ? renderCheckoutForm(total) : renderLoginGate()) + '</div>' +
    '</div>';

    wireEvents();
  }

  function renderCrossSell(lines) {
    const enCarrito = new Set(lines.map((l) => l.product.id));
    const sugeridos = [];
    lines.forEach((l) => {
      (l.product.related || []).forEach((id) => {
        if (enCarrito.has(id) || sugeridos.find((p) => p.id === id)) return;
        const p = akFindProduct(id);
        if (p) sugeridos.push(p);
      });
    });
    if (!sugeridos.length) return '';
    return '<div class="cross-sell">' +
      '<h3 style="font-size:13px;margin:18px 0 10px">TAMBIÉN TE PUEDE INTERESAR</h3>' +
      '<div class="cross-sell-grid">' +
        sugeridos.slice(0, 3).map((p) =>
          '<div class="cross-sell-item">' +
            '<a href="producto.html?id=' + p.id + '" class="ph-box">' + (p.image ? '<img src="' + p.image + '" alt="' + p.name + '">' : akIcon(p.icon)) + '</a>' +
            '<div class="cs-body">' +
              '<a href="producto.html?id=' + p.id + '"><b>' + p.name + '</b></a>' +
              '<span>' + akFormatPrice(p.priceFrom) + '</span>' +
            '</div>' +
            '<button class="btn btn-secondary btn-sm" data-add-cross="' + p.id + '">' + akIcon('plus') + '</button>' +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>';
  }

  function cuponDescuento(subtotal) {
    if (!appliedCupon) return 0;
    const raw = appliedCupon.tipo === 'porcentaje' ? (subtotal * appliedCupon.valor) / 100 : appliedCupon.valor;
    return Math.min(raw, subtotal);
  }

  async function applyCoupon() {
    const input = document.getElementById('coupon-input');
    const codigo = (input.value || '').trim().toUpperCase();
    if (!codigo) return;
    const btn = document.getElementById('coupon-btn');
    btn.disabled = true;
    try {
      const { data: cupon, error } = await akSupabase()
        .from('tienda_cupones')
        .select('*')
        .eq('codigo', codigo)
        .eq('activo', true)
        .maybeSingle();
      if (error || !cupon) {
        akToast('Ese código de descuento no existe o no está activo');
        return;
      }
      const today = new Date().toISOString().slice(0, 10);
      if (cupon.fecha_inicio && today < cupon.fecha_inicio) {
        akToast('Ese cupón todavía no está en vigor');
        return;
      }
      if (cupon.fecha_fin && today > cupon.fecha_fin) {
        akToast('Ese cupón ha caducado');
        return;
      }
      if (cupon.usos_maximos !== null && cupon.usos_actuales >= cupon.usos_maximos) {
        akToast('Ese cupón ya alcanzó su límite de usos');
        return;
      }
      const subtotal = akCartSubtotal();
      if (subtotal < Number(cupon.importe_minimo)) {
        akToast('Este cupón requiere un pedido mínimo de ' + akFormatPrice(Number(cupon.importe_minimo)));
        return;
      }
      appliedCupon = { codigo: cupon.codigo, tipo: cupon.tipo, valor: Number(cupon.valor) };
      akToast('Cupón aplicado');
      render();
    } catch (e) {
      akToast('No se pudo comprobar el cupón, inténtalo de nuevo');
    } finally {
      btn.disabled = false;
    }
  }

  function renderLoginGate() {
    return '<div class="cart-panel">' +
      '<h3>INICIA SESIÓN PARA CONTINUAR</h3>' +
      '<p style="color:var(--muted);font-size:13px;line-height:1.6">Para completar tu pedido necesitas una cuenta — así podemos avisarte del estado y llevar un control correcto de tus compras. Tu carrito se mantiene intacto.</p>' +
      '<a class="btn btn-primary btn-block" href="login.html?redirect=carrito.html">' + akIcon('user') + 'Iniciar sesión o crear cuenta' + akIcon('arrowRight') + '</a>' +
      '<ul class="trust-row" style="margin-top:16px">' +
        '<li>' + akIcon('lock') + 'Pago 100% seguro</li>' +
        '<li>' + akIcon('headset') + 'Soporte experto 7 días</li>' +
      '</ul>' +
    '</div>';
  }

  function renderCheckoutForm(total) {
    const p = PERFIL || {};
    return '<div class="cart-panel">' +
      '<h3>DATOS DEL CLIENTE</h3>' +
      '<div class="field-row">' +
        '<div class="field"><label for="f-nombre">Nombre *</label><input type="text" id="f-nombre" value="' + esc(p.nombre) + '" placeholder="Tu nombre" required></div>' +
        '<div class="field"><label for="f-apellidos">Apellidos *</label><input type="text" id="f-apellidos" value="' + esc(p.apellidos) + '" placeholder="Tus apellidos" required></div>' +
        '<div class="field full"><label for="f-email-display">Email</label><input type="email" id="f-email-display" value="' + esc(CURRENT_USER.email) + '" disabled></div>' +
        '<div class="field full"><label for="f-telefono">Teléfono *</label><input type="tel" id="f-telefono" value="' + esc(p.telefono) + '" placeholder="+34 600 123 456" required></div>' +
      '</div>' +
      renderVehiculoSection() +
      '<h3 style="margin-top:22px">DIRECCIÓN DE ENVÍO</h3>' +
      '<div class="field-row">' +
        '<div class="field full"><label for="f-direccion">Dirección *</label><input type="text" id="f-direccion" value="' + esc(p.direccion) + '" placeholder="Calle, número" required></div>' +
        '<div class="field"><label for="f-cp">Código postal *</label><input type="text" id="f-cp" value="' + esc(p.codigo_postal) + '" placeholder="28001" required></div>' +
        '<div class="field"><label for="f-ciudad">Ciudad *</label><input type="text" id="f-ciudad" value="' + esc(p.ciudad) + '" placeholder="Madrid" required></div>' +
        '<div class="field"><label for="f-pais">País *</label><select id="f-pais"><option>España</option><option>Portugal</option><option>Francia</option></select></div>' +
        '<div class="field"><label for="f-provincia">Provincia *</label><input type="text" id="f-provincia" value="' + esc(p.provincia) + '" placeholder="Madrid" required></div>' +
      '</div>' +
      '<h3 style="margin-top:22px">MÉTODO DE PAGO</h3>' +
      '<div id="pay-methods">' +
        payOption('tarjeta', 'Tarjeta de crédito / débito', 'Paga de forma segura con tu tarjeta.', 'VISA · Mastercard') +
        payOption('paypal', 'PayPal', 'Paga de forma rápida y segura con tu cuenta PayPal.', 'PayPal') +
        payOption('bizum', 'Bizum', 'Paga de forma rápida y segura con Bizum.', 'Bizum') +
      '</div>' +
      '<div class="notice" id="pay-notice">' + akIcon('lock') + '<span id="pay-notice-text">' + pagoNoticeTexto() + '</span></div>' +
      '<h3 style="margin-top:22px">DETALLES DE FACTURACIÓN</h3>' +
      '<div class="field-row">' +
        '<div class="field"><label for="f-nif">NIF / CIF (opcional)</label><input type="text" id="f-nif" value="' + esc(p.nif_cif) + '" placeholder="12345678Z"></div>' +
        '<div class="field"><label for="f-razon">Razón social (opcional)</label><input type="text" id="f-razon" placeholder="Autokeys Soluciones S.L."></div>' +
      '</div>' +
      '<p style="color:var(--muted);font-size:11px;margin:6px 0 0">La factura se emitirá una vez confirmemos el pedido contigo.</p>' +
      '<div style="border-top:1px solid var(--line-soft);margin-top:20px;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
        '<div><div style="font-size:11px;color:var(--muted)">TOTAL ESTIMADO</div><div style="font-size:24px;font-weight:900">' + akFormatPrice(total) + '</div></div>' +
        '<button class="btn btn-primary" id="finish-btn">' + finishBtnTexto() + akIcon('arrowRight') + '</button>' +
      '</div>' +
      '<p style="color:var(--muted);font-size:10.5px;margin-top:10px;display:flex;align-items:center;gap:6px">' + akIcon('lock') + 'Tus datos se transmiten de forma segura. Al enviar aceptas nuestros términos y condiciones.</p>' +
    '</div>';
  }

  function renderVehiculoSection() {
    const options = VEHICULOS.map((v) =>
      '<option value="' + v.id + '"' + (selectedVehiculoId === v.id ? ' selected' : '') + '>' +
        esc(v.marca) + ' ' + esc(v.modelo) + (v.anio ? ' (' + v.anio + ')' : '') + (v.matricula ? ' — ' + esc(v.matricula) : '') +
      '</option>'
    ).join('');
    return '<h3 style="margin-top:22px">VEHÍCULO (OPCIONAL)</h3>' +
      '<p style="color:var(--muted);font-size:12.5px;margin:0 0 10px">Si este pedido es para un vehículo concreto, indícalo — nos ayuda a preparar el trabajo antes de que llegue.</p>' +
      '<div class="field-row">' +
        '<div class="field full">' +
          '<select id="f-vehiculo">' +
            '<option value=""' + (selectedVehiculoId === '' && !showNewVehiculoForm ? ' selected' : '') + '>Ninguno / no especificado</option>' +
            options +
            '<option value="__nuevo__"' + (showNewVehiculoForm ? ' selected' : '') + '>+ Añadir un vehículo nuevo</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      (showNewVehiculoForm ?
        '<div class="field-row" style="margin-top:8px">' +
          '<div class="field"><label for="nv-marca">Marca *</label><input type="text" id="nv-marca" placeholder="BMW"></div>' +
          '<div class="field"><label for="nv-modelo">Modelo *</label><input type="text" id="nv-modelo" placeholder="Serie 1"></div>' +
          '<div class="field"><label for="nv-anio">Año</label><input type="number" id="nv-anio" placeholder="2019"></div>' +
          '<div class="field"><label for="nv-matricula">Matrícula</label><input type="text" id="nv-matricula" placeholder="1234ABC"></div>' +
        '</div>'
        : '');
  }

  function pagoNoticeTexto() {
    return payMethod === 'tarjeta'
      ? 'Con tarjeta pagas ahora mismo de forma segura a través de SumUp.'
      : 'Tu pedido queda registrado como solicitud. Nuestro equipo te contactará para confirmar el pago.';
  }

  function finishBtnTexto() {
    return payMethod === 'tarjeta' ? 'Pagar ahora' : 'Enviar pedido';
  }

  function esc(v) {
    return v ? String(v).replace(/"/g, '&quot;') : '';
  }

  function lineExtraSummary(l) {
    if (!l.extra) return '';
    const parts = [];
    if (l.extra.referencia_pieza) parts.push('Ref: ' + l.extra.referencia_pieza);
    if (l.extra.descripcion_problema) parts.push('Problema: ' + l.extra.descripcion_problema);
    if (l.extra.observaciones) parts.push(l.extra.observaciones);
    if (!parts.length) return '';
    const text = parts.join(' — ');
    return '<p style="color:var(--muted);font-size:11px;margin-top:2px" title="' + esc(text) + '">' +
      esc(text.length > 90 ? text.slice(0, 90) + '…' : text) + '</p>';
  }

  function renderLine(l) {
    return '<div class="cart-item">' +
      '<span class="ph-box">' + akIcon(l.product.icon) + '</span>' +
      '<div class="ci-body">' +
        '<b>' + l.product.name + '</b>' +
        '<p>' + l.variant.name + '</p>' +
        lineExtraSummary(l) +
        '<div class="qty-row"><div class="qty-ctrl">' +
          '<button data-qty="down" data-idx="' + l.index + '">' + akIcon('minus') + '</button>' +
          '<span>' + l.qty + '</span>' +
          '<button data-qty="up" data-idx="' + l.index + '">' + akIcon('plus') + '</button>' +
        '</div></div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">' +
        '<span class="ci-price">' + akFormatPrice(l.lineTotal) + '</span>' +
        '<button class="ci-remove" data-remove="' + l.index + '">' + akIcon('close') + '</button>' +
      '</div>' +
    '</div>';
  }

  function payOption(id, title, desc, tag) {
    return '<label class="pay-option ' + (payMethod === id ? 'selected' : '') + '" data-pay="' + id + '">' +
      '<input type="radio" name="pay" ' + (payMethod === id ? 'checked' : '') + '>' +
      '<span class="po-t"><b>' + title + '</b><span>' + desc + '</span></span>' +
      '<span class="po-icons"><span>' + tag + '</span></span>' +
    '</label>';
  }

  function wireEvents() {
    document.querySelectorAll('[data-qty]').forEach((btn) => btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const lines = akCartLines();
      const line = lines.find((l) => l.index === idx);
      if (!line) return;
      const nextQty = btn.dataset.qty === 'up' ? line.qty + 1 : line.qty - 1;
      if (nextQty <= 0) akCartRemove(idx); else akCartSetQty(idx, nextQty);
      render();
    }));
    document.querySelectorAll('[data-remove]').forEach((btn) => btn.addEventListener('click', () => {
      akCartRemove(Number(btn.dataset.remove));
      render();
    }));
    const couponBtn = document.getElementById('coupon-btn');
    if (couponBtn) couponBtn.addEventListener('click', applyCoupon);
    const couponRemoveBtn = document.getElementById('coupon-remove-btn');
    if (couponRemoveBtn) couponRemoveBtn.addEventListener('click', () => { appliedCupon = null; render(); });
    document.querySelectorAll('[data-pay]').forEach((el) => el.addEventListener('click', () => {
      payMethod = el.dataset.pay;
      document.querySelectorAll('[data-pay]').forEach((x) => x.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      const noticeText = document.getElementById('pay-notice-text');
      if (noticeText) noticeText.textContent = pagoNoticeTexto();
      const finishBtn = document.getElementById('finish-btn');
      if (finishBtn) finishBtn.innerHTML = finishBtnTexto() + akIcon('arrowRight');
    }));
    const finishBtn = document.getElementById('finish-btn');
    if (finishBtn) finishBtn.addEventListener('click', submitOrder);
    document.querySelectorAll('[data-add-cross]').forEach((btn) => btn.addEventListener('click', () => {
      const product = akFindProduct(btn.dataset.addCross);
      if (!product) return;
      akCartAdd(product.id, product.variants[0].id, 1);
      akToast(product.name + ' añadido al carrito');
      render();
    }));
    const vehiculoSelect = document.getElementById('f-vehiculo');
    if (vehiculoSelect) {
      vehiculoSelect.addEventListener('change', (e) => {
        if (e.target.value === '__nuevo__') {
          showNewVehiculoForm = true;
          selectedVehiculoId = '';
        } else {
          showNewVehiculoForm = false;
          selectedVehiculoId = e.target.value;
        }
        render();
      });
    }
  }

  function fieldVal(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function vehiculoReferencia(v) {
    return v.marca + ' ' + v.modelo + (v.anio ? ' (' + v.anio + ')' : '') + (v.matricula ? ' — ' + v.matricula : '');
  }

  async function resolveVehiculo() {
    if (showNewVehiculoForm) {
      const marca = fieldVal('nv-marca');
      const modelo = fieldVal('nv-modelo');
      if (!marca || !modelo) return { id: null, referencia: null };
      const anio = fieldVal('nv-anio');
      const matricula = fieldVal('nv-matricula');
      const { data, error } = await akSupabase()
        .from('tienda_vehiculos')
        .insert({ cliente_id: CURRENT_USER.id, marca, modelo, anio: anio ? Number(anio) : null, matricula: matricula || null })
        .select()
        .single();
      if (error || !data) return { id: null, referencia: null };
      return { id: data.id, referencia: vehiculoReferencia(data) };
    }
    if (selectedVehiculoId) {
      const v = VEHICULOS.find((x) => x.id === selectedVehiculoId);
      if (v) return { id: v.id, referencia: vehiculoReferencia(v) };
    }
    return { id: null, referencia: null };
  }

  async function submitOrder() {
    if (!CURRENT_USER) {
      akToast('Inicia sesión para completar el pedido');
      window.location.href = 'login.html?redirect=carrito.html';
      return;
    }
    const required = [
      ['f-nombre', 'Nombre'], ['f-apellidos', 'Apellidos'], ['f-telefono', 'Teléfono'],
      ['f-direccion', 'Dirección'], ['f-cp', 'Código postal'], ['f-ciudad', 'Ciudad'], ['f-provincia', 'Provincia'],
    ];
    const missing = required.find(([id]) => !fieldVal(id));
    if (missing) {
      akToast('Falta un campo obligatorio: ' + missing[1]);
      document.getElementById(missing[0]).focus();
      return;
    }
    const email = CURRENT_USER.email;

    const btn = document.getElementById('finish-btn');
    btn.disabled = true;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = 'Enviando...';

    const lines = akCartLines();
    const subtotal = akCartSubtotal();
    const ivaPortion = subtotal - subtotal / 1.21;
    const descuento = cuponDescuento(subtotal);
    const total = subtotal - descuento;
    const pedidoId = crypto.randomUUID();
    const numero = 'WEB-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();

    const pedido = {
      id: pedidoId,
      numero,
      usuario_id: CURRENT_USER.id,
      nombre: fieldVal('f-nombre'),
      apellidos: fieldVal('f-apellidos'),
      email,
      telefono: fieldVal('f-telefono'),
      direccion: fieldVal('f-direccion'),
      codigo_postal: fieldVal('f-cp'),
      ciudad: fieldVal('f-ciudad'),
      provincia: fieldVal('f-provincia'),
      pais: fieldVal('f-pais') || 'España',
      nif_cif: fieldVal('f-nif') || null,
      razon_social: fieldVal('f-razon') || null,
      metodo_pago: payMethod,
      cupon: appliedCupon ? appliedCupon.codigo : null,
      subtotal,
      envio: 0,
      descuento,
      iva_importe: ivaPortion,
      total,
    };

    try {
      const client = akSupabase();
      const vehiculo = await resolveVehiculo();
      const { error: pedidoError } = await client.from('tienda_pedidos').insert(pedido);
      if (pedidoError) throw pedidoError;

      const lineas = lines.map((l) => ({
        pedido_id: pedidoId,
        producto_id: l.product.id,
        producto_nombre: l.product.name,
        categoria: l.product.category,
        variante_id: l.variant.id,
        variante_nombre: l.variant.name,
        cantidad: l.qty,
        precio_unitario: l.variant.price,
        vehiculo_id: vehiculo.id,
        referencia_vehiculo: vehiculo.referencia,
        referencia_pieza: (l.extra && l.extra.referencia_pieza) || null,
        descripcion_problema: (l.extra && l.extra.descripcion_problema) || null,
        observaciones: (l.extra && l.extra.observaciones) || null,
      }));
      const { error: lineasError } = await client.from('tienda_pedido_lineas').insert(lineas);
      if (lineasError) console.error('No se pudieron guardar las líneas del pedido:', lineasError);

      akCartSave([]);
      appliedCupon = null;

      fetch('/api/enviar-confirmacion-pedido', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pedido_id: pedidoId }),
      }).catch((e) => console.error('No se pudo enviar el email de confirmación:', e));

      if (payMethod === 'tarjeta') {
        try {
          const pagoRes = await fetch('/api/crear-pago', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pedido_id: pedidoId }),
          });
          const pagoData = await pagoRes.json();
          if (pagoRes.ok && pagoData.hosted_checkout_url) {
            window.location.href = pagoData.hosted_checkout_url;
            return;
          }
        } catch (e) {
          console.error('No se pudo iniciar el pago online:', e);
        }
      }
      showConfirmation(numero, total);
    } catch (err) {
      console.error(err);
      akToast('No hemos podido enviar el pedido. Inténtalo de nuevo o escríbenos por WhatsApp.');
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  function showConfirmation(numero, total) {
    document.querySelectorAll('.cstep').forEach((s, i) => s.classList.toggle('active', i === 3));
    document.getElementById('cart-root').innerHTML =
      '<div class="section"><div class="empty-state">' + akIcon('checkCircle') +
      '<h3>¡Pedido recibido!</h3>' +
      '<p>Tu solicitud <b style="color:#fff">#' + numero + '</b> por ' + akFormatPrice(total) + ' ha sido registrada.<br>' +
      'Nuestro equipo te contactará en breve para confirmar los detalles y el pago.</p>' +
      '<a class="btn btn-primary" style="margin-top:16px" href="index.html">Volver al inicio</a>' +
      '</div></div>';
  }
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
