<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<link rel="dns-prefetch" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<title id="page-title">Servicio — Autokeys Remaps Pro Store</title>
<meta id="meta-description" name="description" content="Ficha de servicio Autokeys Remaps Pro Store.">
<link id="link-canonical" rel="canonical" href="https://www.autokeysremapspro.es/producto.html">
<meta id="meta-og-type" property="og:type" content="product">
<meta property="og:site_name" content="Autokeys Remaps Pro Store">
<meta property="og:locale" content="es_ES">
<meta id="meta-og-title" property="og:title" content="Servicio — Autokeys Remaps Pro Store">
<meta id="meta-og-description" property="og:description" content="Ficha de servicio Autokeys Remaps Pro Store.">
<meta id="meta-og-url" property="og:url" content="https://www.autokeysremapspro.es/producto.html">
<meta id="meta-og-image" property="og:image" content="https://www.autokeysremapspro.es/assets/img/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta id="meta-twitter-title" name="twitter:title" content="Servicio — Autokeys Remaps Pro Store">
<meta id="meta-twitter-description" name="twitter:description" content="Ficha de servicio Autokeys Remaps Pro Store.">
<meta id="meta-twitter-image" name="twitter:image" content="https://www.autokeysremapspro.es/assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>

<header id="site-header" data-active="servicios"></header>

<nav class="breadcrumb" id="breadcrumb"></nav>

<div id="detail-root"></div>
<div class="feature-strip" id="trust-strip"></div>
<div class="info-grid cols-6" id="info-root" style="padding-top:60px"></div>
<div class="faq" id="faq-root"></div>
<div class="section" id="resenas-root"></div>

<footer id="site-footer"></footer>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  let product, selectedVariant;
  let CURRENT_USER = null;
  let isFavorito = false;
  let RESENAS = [];
  let pedidoElegible = null;
  let miPuntuacion = 5;

  document.addEventListener('DOMContentLoaded', async () => {
    await akCatalogReady();
    product = akFindProduct(akQueryParam('id')) || CATALOG[0];
    if (!product) {
      document.getElementById('detail-root').innerHTML =
        '<div class="empty-state">' + akIcon('search') + '<h3>No se pudo cargar el catálogo</h3><p>Inténtalo de nuevo en unos segundos.</p></div>';
      akFillIcons();
      return;
    }
    selectedVariant = product.variants[0];

    try {
      const { data: { user } } = await akSupabase().auth.getUser();
      CURRENT_USER = user;
      if (CURRENT_USER) {
        const { data } = await akSupabase()
          .from('tienda_favoritos')
          .select('id')
          .eq('cliente_id', CURRENT_USER.id)
          .eq('producto_id', product.id)
          .maybeSingle();
        isFavorito = Boolean(data);
      }
    } catch (e) { /* no logueado */ }

    try {
      const { data: resenasData } = await akSupabase()
        .from('tienda_resenas')
        .select('*')
        .eq('producto_id', product.id)
        .order('created_at', { ascending: false });
      RESENAS = resenasData || [];
      if (CURRENT_USER && !RESENAS.some((r) => r.cliente_id === CURRENT_USER.id)) {
        const { data: linea } = await akSupabase()
          .from('tienda_pedido_lineas')
          .select('pedido_id')
          .eq('producto_id', product.id)
          .limit(1)
          .maybeSingle();
        pedidoElegible = linea ? linea.pedido_id : null;
      }
    } catch (e) { /* reseñas no disponibles, no bloquea el resto de la página */ }

    document.title = product.name + ' — Autokeys Remaps Pro Store';
    const cat = akFindCategory(product.category);

    document.getElementById('breadcrumb').innerHTML =
      '<a href="index.html">Inicio</a><span data-icon="chevRight"></span>' +
      '<a href="tienda.html?cat=' + product.category + '">' + (cat ? cat.label : 'Servicios') + '</a><span data-icon="chevRight"></span>' +
      '<span class="current">' + product.name + '</span>';

    renderDetail();
    renderTrustStrip();
    renderInfo();
    renderFaq();
    renderResenas();
    renderSeo();
    akFillIcons();
  });

  function renderDetail() {
    document.getElementById('detail-root').innerHTML =
    '<div class="detail">' +
      '<div>' +
        '<div class="detail-info">' +
          (product.badge ? '<div class="eyebrow">' + product.badge + '</div>' : '') +
          '<h1>' + product.name + '</h1>' +
          (akStarsHtml(product.rating, product.ratingCount) ? '<div style="margin:6px 0 4px">' + akStarsHtml(product.rating, product.ratingCount) + '</div>' : '') +
          '<p class="lead">' + (product.longDesc || product.shortDesc) + '</p>' +
          '<ul class="feature-check">' + product.features.map((f) => '<li>' + akIcon('check') + f + '</li>').join('') + '</ul>' +
        '</div>' +
        '<div class="gallery" style="margin-top:20px">' + renderGaleriaHtml() +
        '</div>' +
      '</div>' +
      '<aside class="buybox metal-frame" id="buybox"></aside>' +
    '</div>';
    renderBuybox();
    wireGaleria();
  }

  function galeriaFotos() {
    return [product.image, ...(product.images || [])].filter(Boolean);
  }

  function renderGaleriaHtml() {
    const fotos = galeriaFotos();
    if (!fotos.length) {
      return '<div class="gallery-main hex-overlay"><span class="ph">' + akIcon(product.icon) + '</span></div>';
    }
    return '' +
      '<div class="gallery-main hex-overlay">' +
        (fotos.length > 1 ? '<button class="gallery-arrow left" type="button" aria-label="Anterior">' + akIcon('chevLeft') + '</button>' : '') +
        '<img class="gm-photo" id="gallery-main-img" src="' + fotos[0] + '" alt="' + akEscapeHtml(product.name) + '">' +
        (fotos.length > 1 ? '<button class="gallery-arrow right" type="button" aria-label="Siguiente">' + akIcon('chevRight') + '</button>' : '') +
      '</div>' +
      (fotos.length > 1
        ? '<div class="thumbs">' + fotos.map((src, i) =>
            '<div class="thumb' + (i === 0 ? ' active' : '') + '" data-src="' + src + '"><img src="' + src + '" alt="" loading="lazy"></div>'
          ).join('') + '</div>'
        : '');
  }

  function wireGaleria() {
    const fotos = galeriaFotos();
    if (fotos.length < 2) return;
    let current = 0;
    const mainImg = document.getElementById('gallery-main-img');
    function setActive(i) {
      current = (i + fotos.length) % fotos.length;
      if (mainImg) mainImg.src = fotos[current];
      document.querySelectorAll('.thumb').forEach((t, idx) => t.classList.toggle('active', idx === current));
    }
    document.querySelectorAll('.thumb').forEach((t, i) => t.addEventListener('click', () => setActive(i)));
    const left = document.querySelector('.gallery-arrow.left');
    const right = document.querySelector('.gallery-arrow.right');
    if (left) left.addEventListener('click', () => setActive(current - 1));
    if (right) right.addEventListener('click', () => setActive(current + 1));
  }

  function renderBuybox() {
    const box = document.getElementById('buybox');
    box.innerHTML =
      '<div class="eyebrow">' + (product.isProduct ? 'PRODUCTO' : 'SERVICIO DE REPARACIÓN') + '</div>' +
      '<div class="price-big" id="price-big">' + akFormatPrice(selectedVariant.price) + '</div>' +
      '<div class="price-note">IVA incluido</div>' +
      '<div class="stock-ok">' + akIcon('checkCircle') + 'Disponible</div>' +
      (akStockUrgencia(product) ? '<div class="stock-urgente">' + akIcon('clock') + akStockUrgencia(product) + '</div>' : '') +
      '<div style="margin-top:18px;font-size:11px;color:var(--muted2);font-weight:800;letter-spacing:.5px">1. SELECCIONA LA OPCIÓN</div>' +
      '<div class="variant-list" id="variant-list">' +
        product.variants.map((v, i) =>
          '<label class="variant ' + (v.id === selectedVariant.id ? 'selected' : '') + '" data-variant="' + v.id + '">' +
            '<input type="radio" name="variant" ' + (v.id === selectedVariant.id ? 'checked' : '') + '>' +
            '<span class="vt"><b>' + v.name + '</b><span>' + v.desc + '</span></span>' +
            '<span class="vp">' + akFormatPrice(v.price) + '</span>' +
          '</label>'
        ).join('') +
      '</div>' +
      (product.isSoftware
        ? '<div style="margin-top:18px;font-size:11px;color:var(--muted2);font-weight:800;letter-spacing:.5px">2. DATOS PARA LA LICENCIA</div>' +
          '<div class="field-row">' +
            '<div class="field full"><label>Email de contacto</label><input type="email" placeholder="tu@email.com"></div>' +
            '<div class="field full"><label>Notas (opcional)</label><textarea placeholder="Equipo, versión u otra información relevante"></textarea></div>' +
          '</div>'
        : '<div style="margin-top:18px;font-size:11px;color:var(--muted2);font-weight:800;letter-spacing:.5px">2. INFORMACIÓN DE TU UNIDAD</div>' +
          '<div class="field-row">' +
            '<div class="field"><label>Referencia / Nº de pieza</label><input type="text" placeholder="Ej. 0 281 034 123"></div>' +
            '<div class="field"><label>Referencia vehículo (opcional)</label><input type="text" placeholder="Ej. 03L 906 022 AB"></div>' +
            '<div class="field full"><label>Describe el problema</label><textarea placeholder="Cuéntanos qué le ocurre a tu vehículo o unidad"></textarea></div>' +
          '</div>') +
      '<div style="display:flex;gap:8px;margin-top:18px">' +
        '<button class="btn btn-primary btn-block" id="add-cart-btn">' + akIcon('cart') + 'Añadir al carrito</button>' +
        '<button class="btn btn-secondary" id="fav-btn" title="Guardar en favoritos" style="padding:0 14px;color:' + (isFavorito ? 'var(--red)' : '') + '">' + akIcon('heart') + '</button>' +
      '</div>' +
      '<ul class="buybox-trust">' +
        '<li>' + akIcon('lock') + 'Pago 100% seguro</li>' +
        '<li>' + akIcon('shield') + (product.warranty || 'Garantía incluida') + '</li>' +
        '<li>' + akIcon('headset') + (product.isSoftware ? (product.support || 'Soporte técnico incluido') : 'Soporte experto 7 días') + '</li>' +
      '</ul>';

    box.querySelectorAll('.variant').forEach((el) => el.addEventListener('click', () => {
      selectedVariant = product.variants.find((v) => v.id === el.dataset.variant);
      box.querySelectorAll('.variant').forEach((x) => x.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      document.getElementById('price-big').textContent = akFormatPrice(selectedVariant.price);
    }));

    document.getElementById('add-cart-btn').addEventListener('click', () => {
      akCartAdd(product.id, selectedVariant.id, 1);
      akToast(product.name + ' añadido al carrito');
    });

    document.getElementById('fav-btn').addEventListener('click', toggleFavorito);
  }

  async function toggleFavorito() {
    if (!CURRENT_USER) {
      window.location.href = 'login.html?redirect=' + encodeURIComponent('producto.html?id=' + product.id);
      return;
    }
    const btn = document.getElementById('fav-btn');
    btn.disabled = true;
    if (isFavorito) {
      const { error } = await akSupabase().from('tienda_favoritos').delete()
        .eq('cliente_id', CURRENT_USER.id).eq('producto_id', product.id);
      if (!error) { isFavorito = false; akToast('Quitado de favoritos'); }
    } else {
      const { error } = await akSupabase().from('tienda_favoritos')
        .insert({ cliente_id: CURRENT_USER.id, producto_id: product.id });
      if (!error) { isFavorito = true; akToast('Guardado en favoritos'); }
    }
    btn.disabled = false;
    btn.style.color = isFavorito ? 'var(--red)' : '';
  }

  function renderTrustStrip() {
    const items = product.isSoftware ? [
      ['award', 'Licencia original', 'Software con licencia legítima'],
      ['truck', 'Activación rápida', 'Recibes el acceso en horas'],
      ['headset', 'Soporte técnico', product.support || 'Incluido durante la vigencia'],
      ['checkCircle', 'Actualizaciones', 'Incluidas según la licencia'],
      ['lock', 'Pago seguro', 'Transacción 100% protegida'],
    ] : [
      ['diag', 'Diagnóstico avanzado', 'Equipos de última generación'],
      ['award', 'Reparación profesional', 'Componentes OEM y técnicos expertos'],
      ['checkCircle', 'Pruebas en banco', 'Verificación completa antes del envío'],
      ['truck', 'Envío asegurado', 'Embalaje seguro y seguimiento'],
      ['shield', 'Satisfacción garantizada', 'Si no lo reparamos, no cobramos'],
    ];
    document.getElementById('trust-strip').innerHTML = items.map((i) =>
      '<div>' + akIcon(i[0]) + '<div><b>' + i[1] + '</b><span>' + i[2] + '</span></div></div>'
    ).join('');
  }

  function renderInfo() {
    let html;
    if (product.isSoftware) {
      const cards = [
        { title: 'COMPATIBILIDAD', h: 'Compatible con', list: product.compatibility },
        { title: 'REQUISITOS', h: 'Qué necesitas', list: product.requirements },
      ].filter((c) => c.list && c.list.length);
      html = cards.map((c) =>
        '<div class="info-card" style="grid-column:span 2"><div class="eyebrow">' + c.title + '</div><h3>' + c.h + '</h3><ul>' +
          c.list.map((li) => '<li>' + li + '</li>').join('') + '</ul></div>'
      ).join('');
      html += '<div class="info-card center" style="grid-column:span 1"><div class="eyebrow">LICENCIA</div>' + akIcon('file', 'ph') + '<h3 style="margin-top:12px;font-size:13px">' + (product.license || 'Consultar condiciones') + '</h3></div>';
      html += '<div class="info-card center" style="grid-column:span 1"><div class="eyebrow">SOPORTE</div>' + akIcon('headset', 'ph') + '<h3 style="margin-top:12px;font-size:13px">' + (product.support || 'Soporte técnico incluido') + '</h3></div>';
    } else {
      const miniSteps = GENERIC_PROCESS.map((s, i) =>
        '<li>' + (i + 1) + '. ' + s.title + '</li>'
      ).join('');
      const cards = [
        { title: '¿QUÉ SOLUCIONAMOS?', h: 'Recuperación técnica', list: product.whatWeFix },
        { title: 'SÍNTOMAS HABITUALES', h: 'Casos frecuentes', list: product.symptoms },
        { title: '¿QUÉ DEBES ENVIARNOS?', h: 'Material necesario', list: product.whatToSend },
      ].filter((c) => c.list && c.list.length);
      html = cards.map((c) =>
        '<div class="info-card"><div class="eyebrow">' + c.title + '</div><h3>' + c.h + '</h3><ul>' +
          c.list.map((li) => '<li>' + li + '</li>').join('') + '</ul></div>'
      ).join('');
      html += '<div class="info-card"><div class="eyebrow">¿CÓMO FUNCIONA?</div><h3>Proceso</h3><ul class="mini-steps" style="line-height:2.1">' + miniSteps + '</ul></div>';
      html += '<div class="info-card center"><div class="eyebrow">TIEMPO HABITUAL</div>' + akIcon('clock', 'ph') + '<h3 style="margin-top:12px">' + (product.turnaround || 'Consultar plazos') + '</h3><p style="color:var(--muted);font-size:11.5px">Tiempo estimado desde recepción.</p></div>';
      html += '<div class="info-card center"><div class="eyebrow">GARANTÍA</div>' + akIcon('shield', 'ph') + '<h3 style="margin-top:12px">' + (product.warranty || 'Garantía incluida') + '</h3><p style="color:var(--muted);font-size:11.5px">En todos nuestros trabajos.</p></div>';
    }
    document.getElementById('info-root').innerHTML = html;
    document.querySelectorAll('#info-root .info-card.center svg').forEach((s) => { s.style.width = '30px'; s.style.height = '30px'; s.style.color = 'var(--red)'; s.style.margin = '0 auto'; });
  }

  function renderFaq() {
    const faqs = product.faqs && product.faqs.length ? product.faqs : GENERIC_FAQS;
    const related = (product.related || []).map((id) => akFindProduct(id)).filter(Boolean);
    document.getElementById('faq-root').innerHTML =
      '<div><div class="eyebrow">FAQ</div><h2>Preguntas frecuentes</h2>' +
        faqs.map((f) => '<details><summary>' + f.q + '</summary><p>' + f.a + '</p></details>').join('') +
      '</div>' +
      '<aside class="related"><div class="eyebrow">SERVICIOS RELACIONADOS</div><h3 style="margin:8px 0 4px">También puede interesarte</h3>' +
        related.map((r) =>
          '<a class="related-item" href="producto.html?id=' + r.id + '"><span class="ph-box">' + akIcon(r.icon) + '</span><span style="flex:1"><b>' + r.name + '</b></span><span>Ver ' + (r.isProduct ? 'producto' : 'servicio') + '</span></a>'
        ).join('') +
      '</aside>';
  }

  function renderResenas() {
    const root = document.getElementById('resenas-root');
    const media = product.rating ? product.rating.toFixed(1) : null;

    const listaHtml = RESENAS.length
      ? RESENAS.map((r) =>
          '<div class="resena-item">' +
            '<div class="resena-top">' +
              akStarsPlain(r.puntuacion) +
              '<b>' + akEscapeHtml(r.cliente_nombre || 'Cliente') + '</b>' +
              '<span class="resena-fecha">' + new Date(r.created_at).toLocaleDateString('es-ES') + '</span>' +
            '</div>' +
            (r.comentario ? '<p>' + akEscapeHtml(r.comentario) + '</p>' : '') +
          '</div>'
        ).join('')
      : '<p style="color:var(--muted);font-size:13px">Todavía no hay reseñas de este producto. ¡Sé el primero en opinar!</p>';

    const formHtml = pedidoElegible
      ? '<div class="resena-form">' +
          '<h3 style="font-size:14px;margin:0 0 10px">Deja tu reseña</h3>' +
          '<div class="resena-picker" id="resena-picker">' +
            [1, 2, 3, 4, 5].map((n) => '<button type="button" data-estrella="' + n + '">' + akStarSvg(n <= miPuntuacion) + '</button>').join('') +
          '</div>' +
          '<textarea id="resena-comentario" placeholder="Cuéntanos qué tal tu experiencia (opcional)" rows="3"></textarea>' +
          '<button class="btn btn-primary" id="resena-enviar" style="margin-top:10px">Publicar reseña</button>' +
        '</div>'
      : '';

    root.innerHTML =
      '<div class="eyebrow">OPINIONES</div>' +
      '<h2 style="display:flex;align-items:center;gap:12px">Reseñas' +
        (media ? '<span style="font-size:16px;color:var(--muted)">' + media + ' · ' + product.ratingCount + ' reseña' + (product.ratingCount === 1 ? '' : 's') + '</span>' : '') +
      '</h2>' +
      '<div class="resenas-grid">' +
        '<div class="resenas-lista">' + listaHtml + '</div>' +
        formHtml +
      '</div>';

    if (pedidoElegible) {
      document.querySelectorAll('#resena-picker [data-estrella]').forEach((btn) => btn.addEventListener('click', () => {
        miPuntuacion = Number(btn.dataset.estrella);
        renderResenas();
      }));
      document.getElementById('resena-enviar').addEventListener('click', enviarResena);
    }
  }

  async function enviarResena() {
    const btn = document.getElementById('resena-enviar');
    btn.disabled = true;
    const comentario = document.getElementById('resena-comentario').value.trim();
    const nombre = (CURRENT_USER.user_metadata && CURRENT_USER.user_metadata.nombre) || CURRENT_USER.email.split('@')[0];
    const { error } = await akSupabase().from('tienda_resenas').insert({
      producto_id: product.id,
      cliente_id: CURRENT_USER.id,
      pedido_id: pedidoElegible,
      puntuacion: miPuntuacion,
      comentario: comentario || null,
      cliente_nombre: nombre,
    });
    btn.disabled = false;
    if (error) {
      akToast('No se pudo publicar la reseña: ' + error.message);
      return;
    }
    akToast('¡Gracias por tu reseña!');
    pedidoElegible = null;
    RESENAS.unshift({ puntuacion: miPuntuacion, comentario, cliente_nombre: nombre, created_at: new Date().toISOString(), cliente_id: CURRENT_USER.id });
    renderResenas();
  }

  function renderSeo() {
    const url = 'https://www.autokeysremapspro.es/producto.html?id=' + product.id;
    const desc = (product.shortDesc || '').slice(0, 160);
    const title = product.name + ' — Autokeys Remaps Pro Store';
    const absUrl = (src) => (/^https?:\/\//.test(src) ? src : 'https://www.autokeysremapspro.es/' + src.replace(/^\//, ''));
    const image = product.image ? absUrl(product.image) : 'https://www.autokeysremapspro.es/assets/img/logo.png';
    const imagenes = galeriaFotos().map(absUrl);

    document.getElementById('meta-description').setAttribute('content', desc);
    document.getElementById('link-canonical').setAttribute('href', url);
    document.getElementById('meta-og-type').setAttribute('content', product.isProduct ? 'product' : 'website');
    document.getElementById('meta-og-title').setAttribute('content', title);
    document.getElementById('meta-og-description').setAttribute('content', desc);
    document.getElementById('meta-og-url').setAttribute('content', url);
    document.getElementById('meta-og-image').setAttribute('content', image);
    document.getElementById('meta-twitter-title').setAttribute('content', title);
    document.getElementById('meta-twitter-description').setAttribute('content', desc);
    document.getElementById('meta-twitter-image').setAttribute('content', image);

    const minPrice = Math.min(...product.variants.map((v) => v.price));
    const schema = {
      '@context': 'https://schema.org',
      '@type': product.isProduct ? 'Product' : 'Service',
      name: product.name,
      description: product.longDesc || product.shortDesc,
      image: imagenes.length ? imagenes : image,
      brand: { '@type': 'Brand', name: 'Autokeys Remaps Pro Store' },
      ...(product.rating ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: product.rating, reviewCount: product.ratingCount } } : {}),
      offers: {
        '@type': 'Offer',
        priceCurrency: 'EUR',
        price: minPrice,
        availability: 'https://schema.org/InStock',
        url: url,
      },
    };
    if (!product.isProduct) {
      schema.provider = { '@type': 'AutomotiveBusiness', name: 'Autokeys Remaps Pro Store', url: 'https://www.autokeysremapspro.es/' };
      schema.areaServed = 'ES';
    }
    let ld = document.getElementById('ld-product');
    if (!ld) {
      ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.id = 'ld-product';
      document.head.appendChild(ld);
    }
    ld.textContent = JSON.stringify(schema);

    const cat = akFindCategory(product.category);
    const breadcrumb = {
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Inicio', item: 'https://www.autokeysremapspro.es/' },
        { '@type': 'ListItem', position: 2, name: cat ? cat.label : 'Servicios', item: 'https://www.autokeysremapspro.es/tienda.html?cat=' + product.category },
        { '@type': 'ListItem', position: 3, name: product.name, item: url },
      ],
    };
    let ldB = document.getElementById('ld-breadcrumb');
    if (!ldB) {
      ldB = document.createElement('script');
      ldB.type = 'application/ld+json';
      ldB.id = 'ld-breadcrumb';
      document.head.appendChild(ldB);
    }
    ldB.textContent = JSON.stringify(breadcrumb);

    const faqs = product.faqs && product.faqs.length ? product.faqs : GENERIC_FAQS;
    const faqSchema = {
      '@context': 'https://schema.org',
      '@type': 'FAQPage',
      mainEntity: faqs.map((f) => ({
        '@type': 'Question',
        name: f.q,
        acceptedAnswer: { '@type': 'Answer', text: f.a },
      })),
    };
    let ldF = document.getElementById('ld-faq');
    if (!ldF) {
      ldF = document.createElement('script');
      ldF.type = 'application/ld+json';
      ldF.id = 'ld-faq';
      document.head.appendChild(ldF);
    }
    ldF.textContent = JSON.stringify(faqSchema);
  }
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
