name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sintaxis de los <script> inline en cada página
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('.').filter((f) => f.endsWith('.html'));
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
            scripts.forEach((s, i) => {
              try {
                new Function(s);
              } catch (e) {
                failed = true;
                console.error(file + ' script ' + i + ': ' + e.message);
              }
            });
          }
          if (failed) process.exit(1);
          console.log('Todos los <script> inline son sintácticamente válidos.');
          "

      - name: Ejecutar tests unitarios (lib/)
        run: node --test test/*.js

      - name: Comprobar sintaxis de los .js de assets/js
        run: |
          for f in assets/js/*.js; do
            node -c "$f" || exit 1
          done
          echo "Todos los .js son sintácticamente válidos."

      - name: Comprobar sintaxis y dependencias de funciones serverless
        run: |
          for f in api/*.js lib/*.js; do
            node -c "$f" || exit 1
          done
          node -e "
            require('./api/crear-pago.js');
            require('./api/confirmar-pago.js');
            require('./api/sumup-webhook.js');
            require('./api/enviar-confirmacion-pedido.js');
            require('./api/generar-envio.js');
            require('./api/calcular-envio.js');
            require('./api/cotizar-pedido.js');
            require('./api/crear-pedido.js');
            require('./api/checkout-health.js');
            require('./lib/order-pricing-server.js');
            console.log('requires críticos resueltos correctamente');
          "
          test ! -f lib/orders-server.js || (echo 'No debe reaparecer un segundo motor de precios/pedidos' && exit 1)
          echo "Todas las funciones de api/ y lib/ son válidas."

      - name: Comprobar endurecimiento estático del checkout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const client = fs.readFileSync('assets/js/supabase-config.js', 'utf8');
          const orderApi = fs.readFileSync('api/crear-pedido.js', 'utf8');
          const paymentApi = fs.readFileSync('api/crear-pago.js', 'utf8');
          for (const marker of ['/api/cotizar-pedido', '/api/crear-pedido', "Authorization: 'Bearer '"]) {
            if (!client.includes(marker)) throw new Error('Falta protección de checkout en cliente: ' + marker);
          }
          if (!orderApi.includes('quoteOrder(') || !orderApi.includes('authenticatedUser(req)')) {
            throw new Error('crear-pedido debe recalcular el pedido y autenticar al usuario');
          }
          if (!paymentApi.includes('pedido.usuario_id !== user.id')) {
            throw new Error('crear-pago debe verificar el propietario del pedido');
          }
          console.log('Endurecimiento del checkout presente.');
          NODE

      - name: Comprobar saneado de assets en rutas anidadas
        run: |
          node <<'NODE'
          const health = require('./api/seo-health.js');
          if (typeof health.patchHtml !== 'function') {
            throw new Error('seo-health no expone patchHtml para smoke test');
          }
          const input = '<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/css/style.css"></head><body><img src="assets/img/logo.png"><script src="assets/js/app.js"></script></body></html>';
          const out = health.patchHtml(input);
          const basePos = out.indexOf('<base href="/">');
          const cssPos = out.indexOf('href="/assets/css/style.css"');
          if (basePos < 0 || cssPos < 0 || basePos > cssPos) {
            throw new Error('El <base> debe aparecer antes del CSS en páginas anidadas');
          }
          for (const expected of [
            'href="/assets/css/style.css"',
            'src="/assets/img/logo.png"',
            'src="/assets/js/app.js"',
          ]) {
            if (!out.includes(expected)) throw new Error('Asset no normalizado: ' + expected);
          }
          if (/(?:href|src)=["']assets\//i.test(out)) {
            throw new Error('Quedan assets relativos que podrían pedir /servicios/assets/...');
          }
          console.log('Saneado de rutas anidadas OK.');
          NODE

      - name: Comprobar que los assets locales referenciados existen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('.').filter((f) => f.endsWith('.html'));
          const missing = [];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)].map((m) => m[1]);
            for (let ref of refs) {
              if (!/^\/?assets\//.test(ref)) continue;
              ref = ref.replace(/^\//, '').split(/[?#]/)[0];
              if (!fs.existsSync(path.resolve(ref))) missing.push(file + ' -> ' + ref);
            }
          }
          if (missing.length) {
            console.error('Assets locales inexistentes:\n' + missing.join('\n'));
            process.exit(1);
          }
          const notFound = fs.readFileSync('404.html', 'utf8');
          if (/(?:src|href)=["']assets\//i.test(notFound)) {
            throw new Error('404.html contiene assets relativos y puede romperse en rutas anidadas');
          }
          console.log('Todos los assets locales referenciados existen y 404 es robusto.');
          NODE

      - name: Comprobar que vercel.json y robots.txt son consistentes
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          grep -q 'sitemap.xml' robots.txt || (echo 'robots.txt no referencia el sitemap' && exit 1)
