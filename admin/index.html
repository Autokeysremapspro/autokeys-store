<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de operaciones — Autokeys Remaps Pro</title>
<meta name="description" content="Panel interno de operaciones Autokeys Remaps Pro Store.">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar">
    <a class="brand" href="../index.html">
      <img class="logo-img" src="../assets/img/logo.png" alt="Autokeys Remaps Pro Store" width="330" height="132">
    </a>
    <nav class="admin-nav" id="admin-nav"></nav>
    <div class="admin-user">
      <div class="au-row">
        <span class="au-avatar" id="au-avatar"></span>
        <span><b>Admin Autokeys</b><span>Administrador</span></span>
      </div>
      <div class="admin-support"><span class="dot"></span><span><b>Soporte interno</b><span>Conectado</span></span></div>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <button class="burger" type="button" data-sidebar-toggle style="display:block" aria-label="Menú">
        <span data-icon="menu"></span>
      </button>
      <form class="search-form" style="max-width:420px" onsubmit="return false">
        <input type="text" placeholder="Buscar por pedido, VIN, cliente, ECU...">
        <button type="submit"><span data-icon="search"></span></button>
      </form>
      <div class="head-actions">
        <a class="head-action" href="#" data-action="mock"><span data-icon="bell"></span><span class="badge">6</span></a>
        <a class="head-action" href="#" data-action="mock"><span data-icon="mail"></span><span class="badge">3</span></a>
        <a class="head-action" href="#" data-action="mock"><span data-icon="gear"></span></a>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-head">
        <div>
          <h1>Dashboard de Operaciones</h1>
          <p>Bienvenido, Admin Autokeys. Aquí tienes el resumen general de la operación.</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <div style="border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12px;display:flex;align-items:center;gap:8px" id="admin-date"><span data-icon="calendar"></span></div>
          <button class="btn btn-secondary btn-sm" data-action="mock"><span data-icon="arrowRight"></span>Exportar</button>
        </div>
      </div>

      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="charts-row" id="charts-row"></div>
      <div class="tables-row" id="tables-row-1"></div>
      <div class="tables-row" id="tables-row-2" style="grid-template-columns:1fr 1fr 1fr"></div>
    </div>

    <div class="eyebrow" style="padding:22px 28px 0">ACCIONES RÁPIDAS</div>
    <div class="admin-quick" id="admin-quick" style="margin-bottom:30px"></div>
  </div>
</div>

<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const ADMIN_NAV = [
    { label: 'Dashboard', icon: 'grid', active: true },
    { label: 'Pedidos', icon: 'box' },
    { label: 'Clientes', icon: 'user' },
    { label: 'Vehículos', icon: 'car' },
    { label: 'Servicios', icon: 'programmer' },
    { label: 'Módulos', icon: 'module' },
    { label: 'Trabajos', icon: 'diag' },
    { label: 'Técnicos', icon: 'headset' },
    { label: 'Envíos', icon: 'truck' },
    { label: 'Facturación', icon: 'file' },
    { label: 'Tickets', icon: 'ticket' },
    { label: 'Stock', icon: 'box' },
    { label: 'Software', icon: 'laptop' },
    { label: 'Configuración', icon: 'gear' },
  ];

  const KPIS = [
    { icon: 'box', label: 'PEDIDOS TOTALES · HOY', value: '48', trend: '+12% vs ayer', up: true },
    { icon: 'file', label: 'INGRESOS (HOY)', value: '€ 12.540,00', trend: '+18% vs ayer', up: true },
    { icon: 'module', label: 'MÓDULOS EN ENTRADA', value: '23', trend: 'En tránsito / recibidos', neutral: true },
    { icon: 'programmer', label: 'TRABAJOS EN CURSO', value: '37', trend: '+7% vs ayer', up: true },
    { icon: 'truck', label: 'ENVÍOS HOY', value: '15', trend: 'En reparación / clonación', neutral: true },
    { icon: 'ticket', label: 'TICKETS ABIERTOS', value: '8', trend: '+2 nuevos', up: true },
  ];

  const CHART_POINTS = [
    { d: '18 May', pedidos: 32, completados: 20 },
    { d: '19 May', pedidos: 48, completados: 30 },
    { d: '20 May', pedidos: 40, completados: 38 },
    { d: '21 May', pedidos: 62, completados: 44 },
    { d: '22 May', pedidos: 55, completados: 50 },
    { d: '23 May', pedidos: 70, completados: 52 },
    { d: '24 May', pedidos: 48, completados: 45 },
  ];

  const WORK_STATUS = [
    { label: 'Programación', value: 12, color: '#ef1f2b' },
    { label: 'Clonación', value: 9, color: '#e2a33c' },
    { label: 'Reparación', value: 7, color: '#5b9dee' },
    { label: 'Diagnóstico', value: 5, color: '#39d17d' },
    { label: 'En espera', value: 4, color: '#5a5a62' },
  ];

  const MODULES_STATUS = [
    { label: 'Recibidos', value: 23 },
    { label: 'En diagnóstico', value: 17 },
    { label: 'En reparación', value: 37 },
    { label: 'Programación', value: 12 },
    { label: 'Listos para envío', value: 11 },
  ];

  const PEDIDOS_RECIENTES = [
    { id: 'AK-24561', cliente: 'Taller RPM', vehiculo: 'BMW 530d F10', estado: 'proceso', total: 450 },
    { id: 'AK-24560', cliente: 'AutoElite', vehiculo: 'Mercedes E220 CDI', estado: 'diagnostico', total: 380 },
    { id: 'AK-24559', cliente: 'ElectroCars', vehiculo: 'VW Golf VII 2.0 TDI', estado: 'programacion', total: 320 },
    { id: 'AK-24558', cliente: 'SpeedWorks', vehiculo: 'Audi A4 B8 2.0 TDI', estado: 'recibido', total: 410 },
    { id: 'AK-24557', cliente: 'MotorLab', vehiculo: 'Peugeot 308 1.6 HDi', estado: 'listo', total: 290 },
  ];

  const TRABAJOS = [
    { id: 'TR-12485', modulo: 'Bosch EDC17CP54', tecnico: 'Carlos M.', progreso: 75, eta: 'Hoy 16:00' },
    { id: 'TR-12484', modulo: 'Mercedes EGS ISM', tecnico: 'Laura G.', progreso: 50, eta: 'Hoy 18:00' },
    { id: 'TR-12483', modulo: 'Continental SID310', tecnico: 'Javier R.', progreso: 30, eta: 'Mañana 10:00' },
    { id: 'TR-12482', modulo: 'Bosch MED17.5.21', tecnico: 'Carlos M.', progreso: 90, eta: 'Hoy 14:00' },
    { id: 'TR-12481', modulo: 'Delphi DCM6.2', tecnico: 'Laura G.', progreso: 20, eta: 'Mañana 12:00' },
  ];

  const ENVIOS = [
    { id: 'EN-9871', destino: 'Madrid, España', mensajeria: 'MRW', estado: 'transito', tracking: 'MRW123456789' },
    { id: 'EN-9870', destino: 'Barcelona, España', mensajeria: 'SEUR', estado: 'transito', tracking: 'SEUR987654321' },
    { id: 'EN-9869', destino: 'Valencia, España', mensajeria: 'Tipsa', estado: 'entregado', tracking: 'TIPS11223344' },
    { id: 'EN-9868', destino: 'Bilbao, España', mensajeria: 'MRW', estado: 'entregado', tracking: 'MRW556677889' },
    { id: 'EN-9867', destino: 'Sevilla, España', mensajeria: 'Correos', estado: 'reparto', tracking: 'CORREOS998877' },
  ];

  const STOCK_CRITICO = [
    { producto: 'Bosch EDC17CP54', actual: 2, minimo: 5, estado: 'critico' },
    { producto: 'Bosch MED17.5.21', actual: 1, minimo: 3, estado: 'critico' },
    { producto: 'Programador KTAG', actual: 0, minimo: 1, estado: 'agotado' },
    { producto: 'Cables Boot Bosch', actual: 3, minimo: 5, estado: 'bajo' },
    { producto: 'Cables Bench Magic', actual: 2, minimo: 4, estado: 'bajo' },
  ];

  const TECNICOS = [
    { nombre: 'Carlos Martínez', esp: 'Programación', activos: 8, carga: 80 },
    { nombre: 'Laura Gutiérrez', esp: 'Clonación', activos: 6, carga: 60 },
    { nombre: 'Javier Rodríguez', esp: 'Reparación', activos: 7, carga: 70 },
    { nombre: 'Miguel Ángel', esp: 'Diagnóstico', activos: 4, carga: 40 },
    { nombre: 'Sofía López', esp: 'Electrónica', activos: 3, carga: 30 },
  ];

  const ALERTAS = [
    { icon: 'box', texto: 'Nuevo módulo recibido', detalle: 'Bosch EDC17CP54 · Pedido #AK-24561', hace: 'Hace 10 min' },
    { icon: 'diag', texto: 'Trabajo retrasado', detalle: '#TR-12478 supera el tiempo estimado', hace: 'Hace 25 min' },
    { icon: 'shield', texto: 'Stock crítico', detalle: 'Bosch MED17.5.21 — Queda 1 unidad', hace: 'Hace 1 h' },
    { icon: 'ticket', texto: 'Ticket urgente', detalle: 'Cliente solicita actualización · #TK-5892', hace: 'Hace 2 h' },
    { icon: 'checkCircle', texto: 'Envío entregado', detalle: '#EN-9869 entregado correctamente', hace: 'Hace 3 h' },
  ];

  const QUICK = [
    ['plus', 'Nuevo Pedido'], ['box', 'Registrar Módulo'], ['programmer', 'Asignar Trabajo'],
    ['truck', 'Crear Envío'], ['ticket', 'Nuevo Ticket'], ['user', 'Añadir Cliente'],
  ];

  const ORD_LABEL = { proceso: ['En reparación', 'warn'], diagnostico: ['En diagnóstico', 'info'], programacion: ['Programación', 'info'], recibido: ['Recibido', 'muted'], listo: ['Listo para envío', 'ok'] };
  const ENV_LABEL = { transito: ['En tránsito', 'info'], entregado: ['Entregado', 'ok'], reparto: ['En reparto', 'warn'] };
  const STOCK_LABEL = { critico: ['Crítico', 'warn'], agotado: ['Agotado', 'muted'], bajo: ['Bajo', 'info'] };

  function pill(cls, label) { return '<span class="status-pill ' + cls + '">' + label + '</span>'; }

  function renderNav() {
    document.getElementById('admin-nav').innerHTML = ADMIN_NAV.map((n) =>
      '<a href="#" class="' + (n.active ? 'active' : '') + '" ' + (n.active ? '' : 'data-action="mock"') + '>' + akIcon(n.icon) + n.label + '</a>'
    ).join('');
  }

  function renderKpis() {
    document.getElementById('kpi-grid').innerHTML = KPIS.map((k) =>
      '<div class="kpi-card"><div class="kc-top">' + akIcon(k.icon) + k.label + '</div><b>' + k.value + '</b>' +
      (k.neutral ? '<span style="font-size:10px;color:var(--muted)">' + k.trend + '</span>' : '<span class="kc-trend ' + (k.up ? 'up' : 'down') + '">' + akIcon(k.up ? 'trendUp' : 'trendDown') + k.trend + '</span>') +
      '</div>'
    ).join('');
  }

  function renderLineChart() {
    const w = 460, h = 160, pad = 24;
    const max = Math.max(...CHART_POINTS.map((p) => p.pedidos)) * 1.15;
    const stepX = (w - pad * 2) / (CHART_POINTS.length - 1);
    const toY = (v) => h - pad - (v / max) * (h - pad * 2 - 16);
    const line = (key) => CHART_POINTS.map((p, i) => (pad + i * stepX) + ',' + toY(p[key])).join(' ');
    const area = 'M' + (pad) + ',' + toY(CHART_POINTS[0].pedidos) + ' L' + line('pedidos').split(' ').join(' L') + ' L' + (pad + stepX * (CHART_POINTS.length - 1)) + ',' + (h - pad) + ' L' + pad + ',' + (h - pad) + ' Z';
    const dots = CHART_POINTS.map((p, i) => '<circle cx="' + (pad + i * stepX) + '" cy="' + toY(p.pedidos) + '" r="3" fill="#ef1f2b" stroke="none"/>').join('');
    const labels = CHART_POINTS.map((p, i) => '<text x="' + (pad + i * stepX) + '" y="' + (h - 4) + '" font-size="8" fill="#6a6a72" text-anchor="middle" stroke="none">' + p.d.split(' ')[0] + '</text>').join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:180px" fill="none" stroke="#ef1f2b" stroke-width="2">' +
      '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef1f2b" stop-opacity="0.28"/><stop offset="100%" stop-color="#ef1f2b" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#areaFill)" stroke="none"/>' +
      '<polyline points="' + line('pedidos') + '"/>' +
      '<polyline points="' + line('completados') + '" stroke="#5a5a62" stroke-dasharray="4 3"/>' +
      dots + labels +
      '</svg>';
  }

  function renderDonut() {
    const total = WORK_STATUS.reduce((s, w) => s + w.value, 0);
    let acc = 0;
    const stops = WORK_STATUS.map((w) => {
      const start = (acc / total) * 360; acc += w.value; const end = (acc / total) * 360;
      return w.color + ' ' + start + 'deg ' + end + 'deg';
    }).join(', ');
    return '<div class="donut-wrap">' +
      '<div style="position:relative;width:120px;height:120px;flex:none">' +
        '<div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(' + stops + ')"></div>' +
        '<div style="position:absolute;inset:16px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center">' +
          '<div><b style="font-size:22px;display:block">' + total + '</b><span style="font-size:9px;color:var(--muted)">EN CURSO</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="donut-legend">' + WORK_STATUS.map((w) => '<div><span><span class="dl-dot" style="background:' + w.color + '"></span>' + w.value + ' ' + w.label + '</span></div>').join('') + '</div>' +
    '</div>';
  }

  function renderModulesProgress() {
    const total = MODULES_STATUS.reduce((s, m) => s + m.value, 0);
    return MODULES_STATUS.map((m) =>
      '<div class="progress-item"><div class="pi-top"><span>' + m.label + '</span><span>' + m.value + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round((m.value / total) * 100) + '%"></div></div></div>'
    ).join('') + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px;margin-top:6px">Total<b style="color:#fff">' + total + '</b></div>';
  }

  function renderCharts() {
    document.getElementById('charts-row').innerHTML =
      '<div class="chart-card"><h3>VISIÓN GENERAL DE PEDIDOS<select><option>Últimos 7 días</option></select></h3>' +
        renderLineChart() +
        '<div style="display:flex;gap:16px;font-size:10.5px;color:var(--muted);margin-top:6px">' +
          '<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:2px;background:#ef1f2b;display:inline-block"></span>Pedidos</span>' +
          '<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:2px;background:#5a5a62;display:inline-block"></span>Completados</span>' +
        '</div>' +
      '</div>' +
      '<div class="chart-card"><h3>ESTADO DE TRABAJOS</h3>' + renderDonut() + '</div>' +
      '<div class="chart-card"><h3>MÓDULOS POR ESTADO</h3>' + renderModulesProgress() + '</div>';
  }

  function renderTables1() {
    document.getElementById('tables-row-1').innerHTML =
      '<div class="admin-panel"><h3>ÚLTIMOS PEDIDOS<a href="#" data-action="mock">Ver todos</a></h3>' +
      '<table class="data-table"><thead><tr><th>ID</th><th>Cliente / Vehículo</th><th>Estado</th><th>Total</th></tr></thead><tbody>' +
      PEDIDOS_RECIENTES.map((p) => { const [l, c] = ORD_LABEL[p.estado]; return '<tr><td>#' + p.id + '</td><td>' + p.cliente + '<br><span style="color:var(--muted);font-size:10.5px">' + p.vehiculo + '</span></td><td>' + pill(c, l) + '</td><td>' + akFormatPrice(p.total) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' +

      '<div class="admin-panel"><h3>TRABAJOS EN CURSO<a href="#" data-action="mock">Ver todos</a></h3>' +
      '<table class="data-table"><thead><tr><th>ID / Módulo</th><th>Técnico</th><th>Progreso</th><th>ETA</th></tr></thead><tbody>' +
      TRABAJOS.map((t) => '<tr><td>#' + t.id + '<br><span style="color:var(--muted);font-size:10.5px">' + t.modulo + '</span></td><td>' + t.tecnico + '</td><td><span class="mini-progress"><span style="width:' + t.progreso + '%"></span></span>' + t.progreso + '%</td><td>' + t.eta + '</td></tr>').join('') +
      '</tbody></table></div>' +

      '<div class="admin-panel"><h3>ÚLTIMOS ENVÍOS<a href="#" data-action="mock">Ver todos</a></h3>' +
      '<table class="data-table"><thead><tr><th>ID</th><th>Destino / Msj.</th><th>Estado</th></tr></thead><tbody>' +
      ENVIOS.map((e) => { const [l, c] = ENV_LABEL[e.estado]; return '<tr><td>#' + e.id + '</td><td>' + e.destino + '<br><span style="color:var(--muted);font-size:10.5px">' + e.mensajeria + ' · ' + e.tracking + '</span></td><td>' + pill(c, l) + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  function renderTables2() {
    document.getElementById('tables-row-2').innerHTML =
      '<div class="admin-panel"><h3>STOCK CRÍTICO<a href="#" data-action="mock">Ver inventario</a></h3>' +
      '<table class="data-table"><thead><tr><th>Producto</th><th>Stock</th><th>Estado</th></tr></thead><tbody>' +
      STOCK_CRITICO.map((s) => { const [l, c] = STOCK_LABEL[s.estado]; return '<tr><td>' + s.producto + '</td><td>' + s.actual + ' / ' + s.minimo + '</td><td>' + pill(c, l) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' +

      '<div class="admin-panel"><h3>TÉCNICOS<a href="#" data-action="mock">Ver equipo</a></h3>' +
      '<table class="data-table"><thead><tr><th>Técnico</th><th>Especialidad</th><th>Carga</th></tr></thead><tbody>' +
      TECNICOS.map((t) => '<tr><td>' + t.nombre + '</td><td>' + t.esp + ' · ' + t.activos + '</td><td><span class="mini-progress"><span style="width:' + t.carga + '%"></span></span>' + t.carga + '%</td></tr>').join('') +
      '</tbody></table></div>' +

      '<div class="admin-panel"><h3>ALERTAS RECIENTES<a href="#" data-action="mock">Ver todas</a></h3>' +
      ALERTAS.map((a) => '<div class="alert-item"><span class="ai-icon">' + akIcon(a.icon) + '</span><div><b>' + a.texto + '</b><span>' + a.detalle + ' · ' + a.hace + '</span></div></div>').join('') +
      '</div>';
  }

  function renderQuick() {
    document.getElementById('admin-quick').innerHTML = QUICK.map((q) =>
      '<button type="button" data-action="mock">' + akIcon(q[0]) + q[1] + '</button>'
    ).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('au-avatar').innerHTML = akIcon('user');
    const today = new Date();
    document.getElementById('admin-date').innerHTML += '<span>' + today.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) + '</span>';
    renderNav();
    renderKpis();
    renderCharts();
    renderTables1();
    renderTables2();
    renderQuick();
    akFillIcons();

    document.body.addEventListener('click', (e) => {
      if (e.target.closest('[data-sidebar-toggle]')) {
        document.getElementById('admin-sidebar').classList.toggle('open');
      }
      if (e.target.closest('[data-action="mock"]')) {
        e.preventDefault();
        akToast('Esta sección se conectará cuando esté listo el backend interno');
      }
    });
  });
</script>
</body>
</html>
