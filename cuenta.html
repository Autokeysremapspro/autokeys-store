<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de cliente — Autokeys Remaps Pro Store</title>
<meta name="description" content="Panel de cliente Autokeys Remaps Pro Store: consulta tus pedidos y gestiona tu perfil.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.autokeys.es/cuenta.html">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>

<header id="site-header" data-active="cuenta"></header>

<nav class="breadcrumb">
  <a href="index.html">Inicio</a><span data-icon="chevRight"></span><span class="current">Mi cuenta</span>
</nav>

<div class="account-layout" id="account-layout" style="display:none">
  <aside class="account-nav" id="account-nav"></aside>
  <div id="account-content"></div>
</div>

<footer id="site-footer"></footer>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const NAV_ITEMS = [
    { id: 'resumen', label: 'Resumen', icon: 'diag' },
    { id: 'pedidos', label: 'Mis pedidos', icon: 'box' },
    { id: 'perfil', label: 'Perfil', icon: 'user' },
  ];

  const ESTADO_LABEL = {
    pendiente: ['Pendiente de revisión', 'warn'],
    contactado: ['Te hemos contactado', 'info'],
    convertido: ['En marcha', 'ok'],
    cancelado: ['Cancelado', 'muted'],
  };

  function pill(estadoKey) {
    const [label, cls] = ESTADO_LABEL[estadoKey] || [estadoKey, 'muted'];
    return '<span class="status-pill ' + cls + '">' + label + '</span>';
  }

  let activeTab = 'resumen';
  let CURRENT_USER = null;
  let PERFIL = null;
  let PEDIDOS = [];

  function renderNav() {
    document.getElementById('account-nav').innerHTML =
      '<div class="an-title">PANEL CLIENTE</div>' +
      NAV_ITEMS.map((n) => '<button data-tab="' + n.id + '" class="' + (activeTab === n.id ? 'active' : '') + '">' + akIcon(n.icon) + n.label + '</button>').join('') +
      '<div class="an-sep"></div>' +
      '<button data-action="logout">' + akIcon('close') + 'Cerrar sesión</button>';
  }

  function renderResumen() {
    const totalGastado = PEDIDOS.filter((p) => p.estado !== 'cancelado').reduce((s, p) => s + Number(p.total), 0);
    const clienteDesde = CURRENT_USER.created_at ? new Date(CURRENT_USER.created_at).toLocaleDateString('es-ES') : '—';
    const nombre = (PERFIL && PERFIL.nombre) || CURRENT_USER.email;

    return '' +
    '<div class="acc-welcome">' +
      '<div><h1>Hola, ' + nombre + '</h1><p>Aquí tienes un resumen de tu actividad.</p></div>' +
      '<div class="acc-meta">' +
        '<div style="font-size:11px;color:var(--muted)">Cliente desde<br><b style="color:#fff;font-size:13px">' + clienteDesde + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="stat-grid">' +
      statCard('box', 'Pedidos realizados', PEDIDOS.length + '', 'pedidos', 'Ver todos') +
      statCard('file', 'Total solicitado', akFormatPrice(totalGastado), 'pedidos', 'Ver detalle') +
      statCard('user', 'Mi perfil', PERFIL && PERFIL.telefono ? 'Completo' : 'Incompleto', 'perfil', 'Editar') +
    '</div>' +
    '<div class="dash-grid" style="grid-template-columns:1fr">' +
      '<div class="dash-panel"><h3>Pedidos recientes<a href="#" data-tab="pedidos">Ver todos</a></h3>' +
        (PEDIDOS.length
          ? PEDIDOS.slice(0, 5).map((p) => '<div class="dp-row"><span class="ph-box">' + akIcon('box') + '</span><div class="dp-body"><b>#' + p.numero + '</b><span>' + new Date(p.created_at).toLocaleDateString('es-ES') + ' · ' + akFormatPrice(p.total) + '</span></div>' + pill(p.estado) + '</div>').join('')
          : '<p style="color:var(--muted);font-size:13px;margin:0">Todavía no has realizado ningún pedido.</p>') +
      '</div>' +
    '</div>' +
    '<div class="quick-actions" style="grid-template-columns:repeat(2,1fr)">' +
      '<a href="tienda.html">' + akIcon('cart') + '<span>Nuevo pedido<br><span class="sub">Realizar compra</span></span></a>' +
      '<a href="tienda.html?cat=reparacion-envio">' + akIcon('truck') + '<span>Solicitar servicio<br><span class="sub">Enviar centralita</span></span></a>' +
    '</div>';
  }

  function statCard(icon, label, value, tab, cta) {
    return '<div class="stat-card"><div class="sc-top">' + akIcon(icon) + label + '</div><b>' + value + '</b><a href="#" data-tab="' + tab + '">' + cta + akIcon('arrowRight') + '</a></div>';
  }

  function renderPedidos() {
    if (!PEDIDOS.length) {
      return panelHeader('Mis pedidos', 'Aquí verás el historial de tus solicitudes.') +
        '<div class="empty-state">' + akIcon('box') + '<h3>Todavía no tienes pedidos</h3><p>Cuando hagas una solicitud en la tienda, aparecerá aquí.</p>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="tienda.html">Ir a la tienda</a></div>';
    }
    return panelHeader('Mis pedidos', 'Historial de tus solicitudes y su estado actual.') +
      '<div class="cart-panel"><table class="data-table"><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>' +
      PEDIDOS.map((p) => '<tr><td>#' + p.numero + '</td><td>' + new Date(p.created_at).toLocaleDateString('es-ES') + '</td><td>' + akFormatPrice(p.total) + '</td><td>' + pill(p.estado) + '</td><td><span style="color:var(--muted);font-size:11.5px">' + (p.lineas || 0) + ' producto' + (p.lineas === 1 ? '' : 's') + '</span></td></tr>').join('') +
      '</tbody></table></div>' +
      '<div class="notice" style="margin-top:16px">' + akIcon('headset') + 'Nuestro equipo revisa cada pedido y te contacta para confirmar el pago y los detalles.</div>';
  }

  function renderPerfil() {
    const p = PERFIL || {};
    return panelHeader('Perfil', 'Estos datos se usan para agilizar tus próximos pedidos.') +
      '<div class="cart-panel" style="max-width:560px">' +
      '<div class="field-row">' +
        '<div class="field"><label>Nombre</label><input type="text" id="p-nombre" value="' + esc(p.nombre) + '"></div>' +
        '<div class="field"><label>Apellidos</label><input type="text" id="p-apellidos" value="' + esc(p.apellidos) + '"></div>' +
        '<div class="field full"><label>Email</label><input type="email" value="' + esc(CURRENT_USER.email) + '" disabled></div>' +
        '<div class="field full"><label>Teléfono</label><input type="tel" id="p-telefono" value="' + esc(p.telefono) + '"></div>' +
      '</div>' +
      '<h3 style="margin-top:18px;font-size:13px">DIRECCIÓN HABITUAL (opcional)</h3>' +
      '<div class="field-row">' +
        '<div class="field full"><label>Dirección</label><input type="text" id="p-direccion" value="' + esc(p.direccion) + '"></div>' +
        '<div class="field"><label>Código postal</label><input type="text" id="p-cp" value="' + esc(p.codigo_postal) + '"></div>' +
        '<div class="field"><label>Ciudad</label><input type="text" id="p-ciudad" value="' + esc(p.ciudad) + '"></div>' +
        '<div class="field"><label>Provincia</label><input type="text" id="p-provincia" value="' + esc(p.provincia) + '"></div>' +
        '<div class="field"><label>NIF / CIF</label><input type="text" id="p-nif" value="' + esc(p.nif_cif) + '"></div>' +
      '</div>' +
      '<button class="btn btn-primary" style="margin-top:16px" id="save-profile-btn">Guardar cambios</button>' +
      '</div>';
  }

  function esc(v) {
    return v ? String(v).replace(/"/g, '&quot;') : '';
  }

  function panelHeader(title, desc) {
    return '<div style="margin-bottom:20px"><h1 style="font-size:22px;margin:0 0 6px">' + title + '</h1><p style="color:var(--muted);font-size:13px;margin:0">' + desc + '</p></div>';
  }

  const RENDERERS = { resumen: renderResumen, pedidos: renderPedidos, perfil: renderPerfil };

  function render() {
    renderNav();
    document.getElementById('account-content').innerHTML = RENDERERS[activeTab]();
    if (activeTab === 'perfil') {
      document.getElementById('save-profile-btn').addEventListener('click', saveProfile);
    }
    akFillIcons();
  }

  async function saveProfile() {
    const btn = document.getElementById('save-profile-btn');
    btn.disabled = true;
    const updates = {
      nombre: document.getElementById('p-nombre').value.trim(),
      apellidos: document.getElementById('p-apellidos').value.trim(),
      telefono: document.getElementById('p-telefono').value.trim(),
      direccion: document.getElementById('p-direccion').value.trim(),
      codigo_postal: document.getElementById('p-cp').value.trim(),
      ciudad: document.getElementById('p-ciudad').value.trim(),
      provincia: document.getElementById('p-provincia').value.trim(),
      nif_cif: document.getElementById('p-nif').value.trim(),
      updated_at: new Date().toISOString(),
    };
    const { error } = await akSupabase().from('tienda_clientes').update(updates).eq('id', CURRENT_USER.id);
    btn.disabled = false;
    if (error) {
      akToast('No se pudieron guardar los cambios');
      return;
    }
    PERFIL = Object.assign({}, PERFIL, updates);
    akToast('Perfil actualizado');
  }

  async function loadData() {
    const client = akSupabase();
    const { data: perfilData } = await client.from('tienda_clientes').select('*').eq('id', CURRENT_USER.id).maybeSingle();
    PERFIL = perfilData;

    const { data: pedidosData } = await client
      .from('tienda_pedidos')
      .select('*, tienda_pedido_lineas(id)')
      .eq('usuario_id', CURRENT_USER.id)
      .order('created_at', { ascending: false });
    PEDIDOS = (pedidosData || []).map((p) => Object.assign({}, p, { lineas: (p.tienda_pedido_lineas || []).length }));
  }

  document.addEventListener('DOMContentLoaded', async () => {
    let user = null;
    try {
      const { data } = await akSupabase().auth.getUser();
      user = data.user;
    } catch (e) { /* supabase not reachable */ }

    if (!user) {
      window.location.href = 'login.html?redirect=cuenta.html';
      return;
    }
    CURRENT_USER = user;
    await loadData();

    document.getElementById('account-layout').style.display = '';
    const hashTab = (window.location.hash || '').replace('#', '');
    if (RENDERERS[hashTab]) activeTab = hashTab;
    render();

    document.body.addEventListener('click', (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        e.preventDefault();
        activeTab = tabBtn.dataset.tab;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
</script>
</body>
</html>
