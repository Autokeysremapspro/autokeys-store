<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<link rel="dns-prefetch" href="https://pbldwfzzyofpbpojzsjg.supabase.co">
<title>Panel de cliente — Autokeys Remaps Pro Store</title>
<meta name="description" content="Panel de cliente Autokeys Remaps Pro Store: consulta tus pedidos y gestiona tu perfil.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.autokeysremapspro.es/cuenta.html">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>

<header id="site-header" data-active="cuenta"></header>

<nav class="breadcrumb">
  <a href="index.html">Inicio</a><span data-icon="chevRight"></span><span class="current">Mi cuenta</span>
</nav>

<div class="account-layout" id="account-layout" style="display:none">
  <aside class="account-nav" id="account-nav"></aside>
  <div id="account-content"></div>
</div>

<footer id="site-footer"></footer>

<script defer src="assets/js/catalog.js"></script>
<script defer src="assets/js/cart.js"></script>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/vendor/supabase-js-2.112.3.min.js"></script>
<script defer src="assets/js/supabase-config.js"></script>
<script defer>
  const NAV_ITEMS = [
    { id: 'resumen', label: 'Resumen', icon: 'diag' },
    { id: 'pedidos', label: 'Mis pedidos', icon: 'box' },
    { id: 'favoritos', label: 'Favoritos', icon: 'heart' },
    { id: 'soporte', label: 'Soporte', icon: 'ticket' },
    { id: 'perfil', label: 'Perfil', icon: 'user' },
  ];

  const TICKET_ESTADO_LABEL = {
    abierto: ['Abierto', 'warn'],
    en_proceso: ['En proceso', 'info'],
    resuelto: ['Resuelto', 'ok'],
    cerrado: ['Cerrado', 'muted'],
  };

  const ESTADO_LABEL = {
    pendiente: ['Pendiente de revisión', 'warn'],
    contactado: ['Te hemos contactado', 'info'],
    convertido: ['En marcha', 'ok'],
    cancelado: ['Cancelado', 'muted'],
  };

  function pill(estadoKey) {
    const [label, cls] = ESTADO_LABEL[estadoKey] || [estadoKey, 'muted'];
    return '<span class="status-pill ' + cls + '">' + label + '</span>';
  }

  let activeTab = 'resumen';
  let CURRENT_USER = null;
  let PERFIL = null;
  let PEDIDOS = [];
  let TICKETS = [];
  let FAVORITOS = [];
  let showNewTicketForm = false;
  let openTicketId = null;
  let openTicketMensajes = [];

  function renderNav() {
    document.getElementById('account-nav').innerHTML =
      '<div class="an-title">PANEL CLIENTE</div>' +
      NAV_ITEMS.map((n) => '<button data-tab="' + n.id + '" class="' + (activeTab === n.id ? 'active' : '') + '">' + akIcon(n.icon) + n.label + '</button>').join('') +
      '<div class="an-sep"></div>' +
      '<button data-action="logout">' + akIcon('close') + 'Cerrar sesión</button>';
  }

  function renderResumen() {
    const totalGastado = PEDIDOS.filter((p) => p.estado !== 'cancelado').reduce((s, p) => s + Number(p.total), 0);
    const clienteDesde = CURRENT_USER.created_at ? new Date(CURRENT_USER.created_at).toLocaleDateString('es-ES') : '—';
    const nombre = (PERFIL && PERFIL.nombre) || CURRENT_USER.email;

    return '' +
    '<div class="acc-welcome">' +
      '<div><h1>Hola, ' + nombre + '</h1><p>Aquí tienes un resumen de tu actividad.</p></div>' +
      '<div class="acc-meta">' +
        '<div style="font-size:11px;color:var(--muted)">Cliente desde<br><b style="color:#fff;font-size:13px">' + clienteDesde + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="stat-grid">' +
      statCard('box', 'Pedidos realizados', PEDIDOS.length + '', 'pedidos', 'Ver todos') +
      statCard('file', 'Total solicitado', akFormatPrice(totalGastado), 'pedidos', 'Ver detalle') +
      statCard('user', 'Mi perfil', PERFIL && PERFIL.telefono ? 'Completo' : 'Incompleto', 'perfil', 'Editar') +
    '</div>' +
    '<div class="dash-grid" style="grid-template-columns:1fr">' +
      '<div class="dash-panel"><h3>Pedidos recientes<a href="#" data-tab="pedidos">Ver todos</a></h3>' +
        (PEDIDOS.length
          ? PEDIDOS.slice(0, 5).map((p) => '<a class="dp-row" href="seguimiento.html?id=' + p.id + '" style="text-decoration:none;color:inherit"><span class="ph-box">' + akIcon('box') + '</span><div class="dp-body"><b>#' + p.numero + '</b><span>' + new Date(p.created_at).toLocaleDateString('es-ES') + ' · ' + akFormatPrice(p.total) + '</span></div>' + pill(p.estado) + '</a>').join('')
          : '<p style="color:var(--muted);font-size:13px;margin:0">Todavía no has realizado ningún pedido.</p>') +
      '</div>' +
    '</div>' +
    '<div class="quick-actions" style="grid-template-columns:repeat(2,1fr)">' +
      '<a href="tienda.html">' + akIcon('cart') + '<span>Nuevo pedido<br><span class="sub">Realizar compra</span></span></a>' +
      '<a href="tienda.html?cat=reparacion-envio">' + akIcon('truck') + '<span>Solicitar servicio<br><span class="sub">Enviar centralita</span></span></a>' +
    '</div>';
  }

  function statCard(icon, label, value, tab, cta) {
    return '<div class="stat-card"><div class="sc-top">' + akIcon(icon) + label + '</div><b>' + value + '</b><a href="#" data-tab="' + tab + '">' + cta + akIcon('arrowRight') + '</a></div>';
  }

  function renderPedidos() {
    if (!PEDIDOS.length) {
      return panelHeader('Mis pedidos', 'Aquí verás el historial de tus solicitudes.') +
        '<div class="empty-state">' + akIcon('box') + '<h3>Todavía no tienes pedidos</h3><p>Cuando hagas una solicitud en la tienda, aparecerá aquí.</p>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="tienda.html">Ir a la tienda</a></div>';
    }
    return panelHeader('Mis pedidos', 'Historial de tus solicitudes y su estado actual.') +
      '<div class="cart-panel"><table class="data-table"><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th><th></th></tr></thead><tbody>' +
      PEDIDOS.map((p) => '<tr><td>#' + p.numero + '</td><td>' + new Date(p.created_at).toLocaleDateString('es-ES') + '</td><td>' + akFormatPrice(p.total) + '</td><td>' + pill(p.estado) + '</td><td><span style="color:var(--muted);font-size:11.5px">' + (p.lineas || 0) + ' producto' + (p.lineas === 1 ? '' : 's') + '</span></td><td><a class="link-red" href="seguimiento.html?id=' + p.id + '">Ver seguimiento' + akIcon('arrowRight') + '</a></td></tr>').join('') +
      '</tbody></table></div>' +
      '<div class="notice" style="margin-top:16px">' + akIcon('headset') + 'Nuestro equipo revisa cada pedido y te contacta para confirmar el pago y los detalles.</div>';
  }

  function ticketPill(estadoKey) {
    const [label, cls] = TICKET_ESTADO_LABEL[estadoKey] || [estadoKey, 'muted'];
    return '<span class="status-pill ' + cls + '">' + label + '</span>';
  }

  function renderSoporte() {
    const ticket = openTicketId ? TICKETS.find((t) => t.id === openTicketId) : null;
    if (ticket) return renderTicketDetail(ticket);

    return panelHeader('Soporte', 'Consulta tus tickets o abre uno nuevo.') +
      '<button class="btn btn-secondary" id="toggle-new-ticket" style="margin-bottom:16px">' + akIcon('plus') + (showNewTicketForm ? 'Cancelar' : 'Nuevo ticket') + '</button>' +
      (showNewTicketForm ? renderNewTicketForm() : '') +
      (TICKETS.length
        ? '<div class="cart-panel"><table class="data-table"><thead><tr><th>Ticket</th><th>Asunto</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>' +
          TICKETS.map((t) => '<tr><td>#' + akEscapeHtml(t.numero) + '</td><td>' + akEscapeHtml(t.asunto) + '</td><td>' + new Date(t.created_at).toLocaleDateString('es-ES') + '</td><td>' + ticketPill(t.estado) + '</td><td><button class="link-red" data-open-ticket="' + t.id + '" style="background:none;border:0;cursor:pointer">Ver' + akIcon('arrowRight') + '</button></td></tr>').join('') +
          '</tbody></table></div>'
        : (showNewTicketForm ? '' : '<div class="empty-state">' + akIcon('ticket') + '<h3>No tienes tickets abiertos</h3><p>Si necesitas ayuda con un pedido o producto, abre un ticket y te responderemos lo antes posible.</p></div>'));
  }

  function renderNewTicketForm() {
    return '<div class="cart-panel" style="max-width:560px;margin-bottom:20px">' +
      '<div class="field-row">' +
        '<div class="field"><label for="t-categoria">Categoría</label><select id="t-categoria">' +
          '<option value="pedido">Pedido</option><option value="producto">Producto</option><option value="envio">Envío</option><option value="otro" selected>Otro</option>' +
        '</select></div>' +
        '<div class="field full"><label for="t-asunto">Asunto</label><input type="text" id="t-asunto" placeholder="Resumen breve" maxlength="120"></div>' +
        '<div class="field full"><label for="t-mensaje">Mensaje</label><textarea id="t-mensaje" rows="4" placeholder="Cuéntanos en qué podemos ayudarte" maxlength="2000"></textarea></div>' +
      '</div>' +
      '<button class="btn btn-primary" id="send-ticket-btn" style="margin-top:12px">Enviar</button>' +
    '</div>';
  }

  function renderTicketDetail(t) {
    return '<a class="link-red" href="#" data-open-ticket="">' + akIcon('chevLeft') + 'Volver a mis tickets</a>' +
      '<div style="margin:16px 0">' +
        '<h1 style="font-size:20px;margin:0 0 4px">' + akEscapeHtml(t.asunto) + '</h1>' +
        '<p style="color:var(--muted);font-size:12.5px;margin:0">Ticket #' + akEscapeHtml(t.numero) + ' · ' + ticketPill(t.estado) + '</p>' +
      '</div>' +
      '<div class="cart-panel" style="max-width:640px">' +
        '<div id="ticket-thread" style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">' +
          (openTicketMensajes.length
            ? openTicketMensajes.map((m) =>
                '<div style="align-self:' + (m.autor_tipo === 'staff' ? 'flex-start' : 'flex-end') + ';max-width:80%;background:' + (m.autor_tipo === 'staff' ? 'var(--panel2)' : 'var(--red)') + ';border-radius:10px;padding:10px 14px">' +
                  '<div style="font-size:10px;opacity:.75;margin-bottom:3px">' + akEscapeHtml(m.autor_nombre || (m.autor_tipo === 'staff' ? 'Soporte' : 'Tú')) + ' · ' + new Date(m.created_at).toLocaleString('es-ES') + '</div>' +
                  '<div style="font-size:13px;white-space:pre-wrap">' + akEscapeHtml(m.mensaje) + '</div>' +
                '</div>'
              ).join('')
            : '<p style="color:var(--muted);font-size:13px">Cargando mensajes…</p>') +
        '</div>' +
        (t.estado !== 'cerrado'
          ? '<div class="field full"><textarea id="t-reply" rows="3" placeholder="Escribe una respuesta…" maxlength="2000"></textarea></div>' +
            '<button class="btn btn-primary" id="send-reply-btn" style="margin-top:10px">Responder</button>'
          : '<p style="color:var(--muted);font-size:12.5px">Este ticket está cerrado.</p>') +
      '</div>';
  }

  function renderPerfil() {
    const p = PERFIL || {};
    const esEmpresa = p.tipo_cliente === 'empresa';
    return panelHeader('Perfil', 'Estos datos se usan para agilizar tus próximos pedidos.') +
      '<div class="cart-panel" style="max-width:560px">' +
      '<div class="tipo-toggle" style="max-width:280px">' +
        '<button type="button" class="tipo-btn ' + (!esEmpresa ? 'active' : '') + '" data-perfil-tipo="particular">Particular</button>' +
        '<button type="button" class="tipo-btn ' + (esEmpresa ? 'active' : '') + '" data-perfil-tipo="empresa">Empresa</button>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label for="p-nombre">' + (esEmpresa ? 'Nombre de contacto' : 'Nombre') + '</label><input type="text" id="p-nombre" value="' + esc(p.nombre) + '"></div>' +
        '<div class="field"><label for="p-apellidos">Apellidos</label><input type="text" id="p-apellidos" value="' + esc(p.apellidos) + '"></div>' +
        '<div class="field full"><label for="p-email-display">Email</label><input type="email" id="p-email-display" value="' + esc(CURRENT_USER.email) + '" disabled></div>' +
        '<div class="field full"><label for="p-telefono">Teléfono</label><input type="tel" id="p-telefono" value="' + esc(p.telefono) + '"></div>' +
        (esEmpresa
          ? '<div class="field full"><label for="p-razon">Razón social</label><input type="text" id="p-razon" value="' + esc(p.razon_social) + '"></div>'
          : '') +
      '</div>' +
      '<h3 style="margin-top:18px;font-size:13px">DIRECCIÓN HABITUAL (opcional)</h3>' +
      '<div class="field-row">' +
        '<div class="field full"><label for="p-direccion">Dirección</label><input type="text" id="p-direccion" value="' + esc(p.direccion) + '"></div>' +
        '<div class="field"><label for="p-cp">Código postal</label><input type="text" id="p-cp" value="' + esc(p.codigo_postal) + '"></div>' +
        '<div class="field"><label for="p-ciudad">Ciudad</label><input type="text" id="p-ciudad" value="' + esc(p.ciudad) + '"></div>' +
        '<div class="field"><label for="p-provincia">Provincia</label><input type="text" id="p-provincia" value="' + esc(p.provincia) + '"></div>' +
        '<div class="field"><label for="p-nif">NIF / CIF</label><input type="text" id="p-nif" value="' + esc(p.nif_cif) + '"></div>' +
      '</div>' +
      '<button class="btn btn-primary" style="margin-top:16px" id="save-profile-btn">Guardar cambios</button>' +
      '</div>' +
      '<div class="cart-panel" style="max-width:560px;margin-top:20px">' +
      '<h3 style="font-size:13px;margin:0 0 12px">CAMBIAR CONTRASEÑA</h3>' +
      '<div class="field-row">' +
        '<div class="field full"><label for="p-pass-nueva">Nueva contraseña</label><input type="password" id="p-pass-nueva" placeholder="Mínimo 8 caracteres"></div>' +
        '<div class="field full"><label for="p-pass-repite">Repite la contraseña</label><input type="password" id="p-pass-repite" placeholder="Mínimo 8 caracteres"></div>' +
      '</div>' +
      '<button class="btn btn-secondary" style="margin-top:16px" id="save-password-btn">Actualizar contraseña</button>' +
      '</div>';
  }

  function esc(v) {
    return v ? String(v).replace(/"/g, '&quot;') : '';
  }

  function panelHeader(title, desc) {
    return '<div style="margin-bottom:20px"><h1 style="font-size:22px;margin:0 0 6px">' + title + '</h1><p style="color:var(--muted);font-size:13px;margin:0">' + desc + '</p></div>';
  }

  const RENDERERS = { resumen: renderResumen, pedidos: renderPedidos, favoritos: renderFavoritos, soporte: renderSoporte, perfil: renderPerfil };

  function render() {
    renderNav();
    document.getElementById('account-content').innerHTML = RENDERERS[activeTab]();
    if (activeTab === 'perfil') {
      document.getElementById('save-profile-btn').addEventListener('click', saveProfile);
      document.getElementById('save-password-btn').addEventListener('click', savePassword);
      document.querySelectorAll('[data-perfil-tipo]').forEach((btn) => btn.addEventListener('click', () => {
        PERFIL = Object.assign({}, PERFIL, { tipo_cliente: btn.dataset.perfilTipo });
        render();
      }));
    }
    if (activeTab === 'soporte') {
      const toggleBtn = document.getElementById('toggle-new-ticket');
      if (toggleBtn) toggleBtn.addEventListener('click', () => { showNewTicketForm = !showNewTicketForm; render(); });
      const sendBtn = document.getElementById('send-ticket-btn');
      if (sendBtn) sendBtn.addEventListener('click', sendNewTicket);
      const replyBtn = document.getElementById('send-reply-btn');
      if (replyBtn) replyBtn.addEventListener('click', sendReply);
    }
    akFillIcons();
  }

  async function sendNewTicket() {
    const asunto = document.getElementById('t-asunto').value.trim();
    const mensaje = document.getElementById('t-mensaje').value.trim();
    const categoria = document.getElementById('t-categoria').value;
    if (!asunto || !mensaje) { akToast('Rellena el asunto y el mensaje'); return; }
    const btn = document.getElementById('send-ticket-btn');
    btn.disabled = true;
    const numero = 'TCK-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
    const client = akSupabase();
    const { data: nuevoTicket, error } = await client
      .from('tienda_tickets')
      .insert({ numero, cliente_id: CURRENT_USER.id, asunto, categoria })
      .select()
      .single();
    if (error || !nuevoTicket) {
      btn.disabled = false;
      akToast('No se pudo crear el ticket');
      return;
    }
    await client.from('tienda_ticket_mensajes').insert({
      ticket_id: nuevoTicket.id, autor_tipo: 'cliente', autor_id: CURRENT_USER.id,
      autor_nombre: (PERFIL && PERFIL.nombre) || CURRENT_USER.email, mensaje,
    });
    TICKETS = [nuevoTicket, ...TICKETS];
    showNewTicketForm = false;
    akToast('Ticket enviado, te responderemos pronto');
    render();
  }

  async function openTicket(id) {
    openTicketId = id;
    openTicketMensajes = [];
    render();
    const { data } = await akSupabase().from('tienda_ticket_mensajes').select('*').eq('ticket_id', id).order('created_at', { ascending: true });
    openTicketMensajes = data || [];
    if (activeTab === 'soporte' && openTicketId === id) render();
  }

  async function sendReply() {
    const mensaje = document.getElementById('t-reply').value.trim();
    if (!mensaje || !openTicketId) return;
    const btn = document.getElementById('send-reply-btn');
    btn.disabled = true;
    const { error } = await akSupabase().from('tienda_ticket_mensajes').insert({
      ticket_id: openTicketId, autor_tipo: 'cliente', autor_id: CURRENT_USER.id,
      autor_nombre: (PERFIL && PERFIL.nombre) || CURRENT_USER.email, mensaje,
    });
    if (error) {
      btn.disabled = false;
      akToast('No se pudo enviar la respuesta');
      return;
    }
    await openTicket(openTicketId);
  }

  async function saveProfile() {
    const btn = document.getElementById('save-profile-btn');
    btn.disabled = true;
    const updates = {
      nombre: document.getElementById('p-nombre').value.trim(),
      apellidos: document.getElementById('p-apellidos').value.trim(),
      telefono: document.getElementById('p-telefono').value.trim(),
      direccion: document.getElementById('p-direccion').value.trim(),
      codigo_postal: document.getElementById('p-cp').value.trim(),
      ciudad: document.getElementById('p-ciudad').value.trim(),
      provincia: document.getElementById('p-provincia').value.trim(),
      nif_cif: document.getElementById('p-nif').value.trim(),
      tipo_cliente: PERFIL && PERFIL.tipo_cliente === 'empresa' ? 'empresa' : 'particular',
      updated_at: new Date().toISOString(),
    };
    const razonInput = document.getElementById('p-razon');
    if (razonInput) updates.razon_social = razonInput.value.trim();
    const { error } = await akSupabase().from('tienda_clientes').update(updates).eq('id', CURRENT_USER.id);
    btn.disabled = false;
    if (error) {
      akToast('No se pudieron guardar los cambios');
      return;
    }
    PERFIL = Object.assign({}, PERFIL, updates);
    akToast('Perfil actualizado');
  }

  async function savePassword() {
    const nueva = document.getElementById('p-pass-nueva').value;
    const repite = document.getElementById('p-pass-repite').value;
    if (nueva.length < 8) { akToast('La contraseña debe tener al menos 8 caracteres'); return; }
    if (nueva !== repite) { akToast('Las contraseñas no coinciden'); return; }
    const btn = document.getElementById('save-password-btn');
    btn.disabled = true;
    const { error } = await akSupabase().auth.updateUser({ password: nueva });
    btn.disabled = false;
    if (error) { akToast('No se pudo actualizar la contraseña: ' + error.message); return; }
    document.getElementById('p-pass-nueva').value = '';
    document.getElementById('p-pass-repite').value = '';
    akToast('Contraseña actualizada');
  }

  async function loadData() {
    const client = akSupabase();
    const { data: perfilData } = await client.from('tienda_clientes').select('*').eq('id', CURRENT_USER.id).maybeSingle();
    PERFIL = perfilData;

    const { data: pedidosData } = await client
      .from('tienda_pedidos')
      .select('*, tienda_pedido_lineas(id)')
      .eq('usuario_id', CURRENT_USER.id)
      .order('created_at', { ascending: false });
    PEDIDOS = (pedidosData || []).map((p) => Object.assign({}, p, { lineas: (p.tienda_pedido_lineas || []).length }));

    const { data: ticketsData } = await client
      .from('tienda_tickets')
      .select('*')
      .eq('cliente_id', CURRENT_USER.id)
      .order('created_at', { ascending: false });
    TICKETS = ticketsData || [];

    const { data: favData } = await client
      .from('tienda_favoritos')
      .select('id, producto_id, created_at')
      .eq('cliente_id', CURRENT_USER.id)
      .order('created_at', { ascending: false });
    FAVORITOS = (favData || []).map((f) => Object.assign({}, f, { producto: akFindProduct(f.producto_id) })).filter((f) => f.producto);
  }

  function renderFavoritos() {
    return panelHeader('Favoritos', 'Los productos y servicios que has guardado.') +
      (FAVORITOS.length
        ? '<div class="fav-grid">' + FAVORITOS.map((f) =>
            '<div class="fav-item">' +
              '<a href="producto.html?id=' + f.producto.id + '">' +
                '<span class="ph-box">' + akIcon(f.producto.icon || 'box') + '</span>' +
                '<span><b>' + esc(f.producto.name) + '</b><span>' + akFormatPrice(f.producto.priceFrom) + '</span></span>' +
              '</a>' +
              '<button class="btn btn-secondary" data-remove-fav="' + f.producto_id + '" title="Quitar de favoritos">' + akIcon('close') + '</button>' +
            '</div>'
          ).join('') + '</div>'
        : '<div class="empty-state">' + akIcon('heart') + '<h3>Aún no has guardado nada</h3><p>Pulsa el corazón en la ficha de un producto para guardarlo aquí.</p></div>');
  }

  document.addEventListener('DOMContentLoaded', async () => {
    let user = null;
    try {
      const { data } = await akSupabase().auth.getUser();
      user = data.user;
    } catch (e) { /* supabase not reachable */ }

    if (!user) {
      window.location.href = 'login.html?redirect=cuenta.html';
      return;
    }
    CURRENT_USER = user;
    await akCatalogReady();
    await loadData();

    document.getElementById('account-layout').style.display = '';
    const hashTab = (window.location.hash || '').replace('#', '');
    if (RENDERERS[hashTab]) activeTab = hashTab;
    render();

    document.body.addEventListener('click', (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        e.preventDefault();
        activeTab = tabBtn.dataset.tab;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const ticketBtn = e.target.closest('[data-open-ticket]');
      if (ticketBtn) {
        e.preventDefault();
        const id = ticketBtn.dataset.openTicket;
        if (id) openTicket(id);
        else { openTicketId = null; render(); }
      }
      const logoutBtn = e.target.closest('[data-action="logout"]');
      if (logoutBtn) {
        e.preventDefault();
        akSupabase().auth.signOut().then(() => { window.location.href = 'index.html'; });
      }
      const removeFavBtn = e.target.closest('[data-remove-fav]');
      if (removeFavBtn) {
        e.preventDefault();
        removeFavorito(removeFavBtn.dataset.removeFav);
      }
    });
  });

  async function removeFavorito(productoId) {
    const { error } = await akSupabase().from('tienda_favoritos').delete()
      .eq('cliente_id', CURRENT_USER.id).eq('producto_id', productoId);
    if (error) { akToast('No se pudo quitar de favoritos'); return; }
    FAVORITOS = FAVORITOS.filter((f) => f.producto_id !== productoId);
    render();
  }
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
