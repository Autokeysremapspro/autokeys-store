<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://pbldwfzzyofpbpojzsjg.supabase.co">

<title>Seguimiento de pedido — Autokeys Remaps Pro Store</title>
<meta name="description" content="Sigue el estado de tu pedido en tiempo real: diagnóstico, reparación, pruebas y envío.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.autokeysremapspro.es/seguimiento.html">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230a0a0c%27/%3E%3Crect x=%273%27 y=%273%27 width=%2758%27 height=%2758%27 rx=%2712%27 fill=%27none%27 stroke=%27%23ef1f2b%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial%27 font-weight=%27900%27 font-style=%27italic%27 font-size=%2726%27 fill=%27%23ef1f2b%27 text-anchor=%27middle%27%3EAK%3C/text%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>

<header id="site-header" data-active="cuenta"></header>
<main id="main">

<nav class="breadcrumb">
  <a href="index.html">Inicio</a><span data-icon="chevRight"></span>
  <a href="cuenta.html">Mi cuenta</a><span data-icon="chevRight"></span>
  <span class="current" id="bc-order">Pedido</span>
</nav>

<div id="track-root" class="section" style="padding-bottom:0">
  <p>Cargando pedido…</p>
</div>

</main>

<footer id="site-footer"></footer>

<script defer src="assets/js/catalog.js"></script>
<script defer src="assets/js/cart.js"></script>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/vendor/supabase-js-2.112.3.min.js"></script>
<script defer src="assets/js/supabase-config.js"></script>
<script defer>
  const ESTADO_LABEL = {
    pendiente: ['Pendiente de revisión', 'warn'],
    contactado: ['Te hemos contactado', 'info'],
    convertido: ['En marcha', 'ok'],
    cancelado: ['Cancelado', 'muted'],
  };
  const PAGO_ESTADO_LABEL = {
    pendiente: ['Pago pendiente', 'warn'],
    pagado: ['Pagado', 'ok'],
    fallido: ['Pago fallido', 'muted'],
  };
  const ENVIO_ESTADO_LABEL = {
    preparando: ['Preparando', 'warn'],
    enviado: ['Enviado', 'info'],
    entregado: ['Entregado', 'ok'],
  };
  const MODULO_STEPS = [
    { id: 'recibido', label: 'Recibido', icon: 'box' },
    { id: 'diagnostico', label: 'Diagnóstico', icon: 'diag' },
    { id: 'reparacion', label: 'Reparación', icon: 'programmer' },
    { id: 'programacion', label: 'Programación', icon: 'ecu' },
    { id: 'listo_envio', label: 'Listo para envío', icon: 'shield' },
    { id: 'entregado', label: 'Entregado', icon: 'checkCircle' },
  ];

  function pill(map, key) {
    const [label, cls] = map[key] || [key || '—', 'muted'];
    return '<span class="status-pill ' + cls + '">' + akEscapeHtml(label) + '</span>';
  }

  function renderLineaTimeline(linea) {
    const stepIndex = linea.estado_modulo ? MODULO_STEPS.findIndex((s) => s.id === linea.estado_modulo) : -1;
    return '' +
    '<div class="cart-panel" style="margin-bottom:16px">' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">' +
        '<span class="ph-box" style="width:56px;height:56px">' + akIcon('box') + '</span>' +
        '<div style="flex:1;min-width:200px">' +
          (linea.categoria ? '<div class="product-cat">' + akEscapeHtml(linea.categoria) + '</div>' : '') +
          '<h3 style="margin:6px 0">' + akEscapeHtml(linea.producto_nombre) + (linea.variante_nombre ? ' — ' + akEscapeHtml(linea.variante_nombre) : '') + '</h3>' +
          '<p style="color:var(--muted);font-size:12px;margin:0">' +
            'Cantidad: ' + linea.cantidad +
            (linea.referencia_vehiculo ? ' · Vehículo: ' + akEscapeHtml(linea.referencia_vehiculo) : '') +
            (linea.referencia_pieza ? ' · Ref: ' + akEscapeHtml(linea.referencia_pieza) : '') +
          '</p>' +
          (linea.descripcion_problema ? '<p style="color:var(--muted);font-size:12px;margin:6px 0 0"><b style="color:#e4e4e7">Problema descrito:</b> ' + akEscapeHtml(linea.descripcion_problema) + '</p>' : '') +
        '</div>' +
        (linea.eta_entrega ? '<div style="text-align:right;font-size:11px;color:var(--muted)">Entrega estimada<br><b style="color:#fff;font-size:12.5px">' + new Date(linea.eta_entrega).toLocaleDateString('es-ES') + '</b></div>' : '') +
      '</div>' +
      (stepIndex >= 0
        ? '<div class="eyebrow" style="margin-top:18px">PROGRESO</div>' +
          '<div class="track-timeline">' + MODULO_STEPS.map((s, i) => {
            const cls = i < stepIndex ? 'done' : i === stepIndex ? 'current' : '';
            return '<div class="track-step ' + cls + '"><div class="circle">' + (i < stepIndex ? akIcon('check') : akIcon(s.icon)) + '</div><b>' + (i + 1) + '. ' + s.label.toUpperCase() + '</b></div>';
          }).join('') + '</div>'
        : '<p style="color:var(--muted);font-size:12.5px;margin-top:16px">Este producto/servicio está pendiente de que nuestro equipo lo revise y comience a procesarlo.</p>') +
    '</div>';
  }

  function renderPedido(pedido, lineas) {
    document.getElementById('bc-order').textContent = 'Pedido #' + pedido.numero;

    const totalGastado = Number(pedido.total);
    const yaEnviado = pedido.envio_estado === 'enviado' || pedido.envio_estado === 'entregado';
    const shipBox = (yaEnviado || pedido.transportista || pedido.numero_seguimiento)
      ? '<div class="ship-box">' +
          '<h4>' + akIcon('truck') + 'INFORMACIÓN DE ENVÍO</h4>' +
          (pedido.transportista ? '<div class="ship-row"><span>Transportista</span><b>' + akEscapeHtml(pedido.transportista) + '</b></div>' : '') +
          (pedido.numero_seguimiento ? '<div class="ship-row"><span>Nº seguimiento</span><b>' + akEscapeHtml(pedido.numero_seguimiento) + '</b></div>' : '') +
          pill(ENVIO_ESTADO_LABEL, pedido.envio_estado || 'preparando') +
        '</div>'
      : '<div class="ship-box">' +
          '<h4>' + akIcon('truck') + 'INFORMACIÓN DE ENVÍO</h4>' +
          '<p style="color:var(--muted);font-size:12.5px;margin:0">Tu pedido aún no ha sido enviado. Verás aquí los datos de transportista y seguimiento en cuanto salga de nuestro laboratorio.</p>' +
        '</div>';

    document.getElementById('track-root').outerHTML =
    '<div class="section" style="padding-bottom:0">' +
      '<a class="link-red" href="cuenta.html"><span data-icon="chevLeft"></span>Volver a mis pedidos</a>' +
      '<div class="eyebrow" style="margin-top:18px">SEGUIMIENTO DE PEDIDO</div>' +
      '<h1 style="margin-bottom:2px;font-size:32px">Pedido #' + akEscapeHtml(pedido.numero) + '</h1>' +
      '<p class="section-desc">Realizado el ' + new Date(pedido.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) + '</p>' +
    '</div>' +
    '<div class="track-layout" style="margin-top:24px">' +
      '<div>' +
        '<div class="track-status">' +
          '<div>' +
            '<div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px">ESTADO DEL PEDIDO</div>' +
            '<div class="ts-current">' + pill(ESTADO_LABEL, pedido.estado) + '</div>' +
          '</div>' +
          '<div style="text-align:right">' + pill(PAGO_ESTADO_LABEL, pedido.pago_estado) + '</div>' +
        '</div>' +
        (lineas.length ? lineas.map(renderLineaTimeline).join('') : '<p style="color:var(--muted)">Este pedido no tiene líneas asociadas.</p>') +
        '<div class="notice" style="margin-top:4px">' + akIcon('headset') + '<span>¿Necesitas ayuda con tu pedido? Nuestro equipo está disponible.</span></div>' +
        '<div class="help-mini">' +
          '<a href="https://wa.me/34632982646" target="_blank" rel="noopener">' + akIcon('whatsapp') + '<b>Soporte por WhatsApp</b><span style="color:var(--muted)">+34 632 98 26 46</span></a>' +
          '<a href="tel:+34953852778">' + akIcon('phone') + '<b>Llamada telefónica</b><span style="color:var(--muted)">+34 953 85 27 78</span></a>' +
          '<a href="mailto:info@autokeyspro.es">' + akIcon('mail') + '<b>Correo electrónico</b><span style="color:var(--muted)">info@autokeyspro.es</span></a>' +
          '<a href="cuenta.html#soporte">' + akIcon('ticket') + '<b>Abrir ticket de soporte</b><span style="color:var(--muted)">Desde tu cuenta</span></a>' +
        '</div>' +
      '</div>' +
      '<aside>' +
        shipBox +
        '<div class="ship-box">' +
          '<h4>' + akIcon('file') + 'RESUMEN DEL PEDIDO</h4>' +
          '<div class="totals">' +
            '<div class="row"><span>Subtotal</span><span>' + akFormatPrice(Number(pedido.subtotal)) + '</span></div>' +
            '<div class="row"><span>Envío</span><span>' + (Number(pedido.envio) ? akFormatPrice(Number(pedido.envio)) : 'Gratis') + '</span></div>' +
            (Number(pedido.descuento) > 0 ? '<div class="row"><span>Descuento' + (pedido.cupon ? ' (' + akEscapeHtml(pedido.cupon) + ')' : '') + '</span><span>−' + akFormatPrice(Number(pedido.descuento)) + '</span></div>' : '') +
            '<div class="row"><span>IVA (incluido)</span><span>' + akFormatPrice(Number(pedido.iva_importe)) + '</span></div>' +
            '<div class="row total"><span>Total</span><span>' + akFormatPrice(totalGastado) + '</span></div>' +
          '</div>' +
        '</div>' +
      '</aside>' +
    '</div>';
  }

  function renderNoEncontrado() {
    document.getElementById('track-root').innerHTML =
      '<div class="empty-state">' + akIcon('box') +
      '<h3>Pedido no encontrado</h3>' +
      '<p>Puede que el enlace no sea correcto o que el pedido pertenezca a otra cuenta.</p>' +
      '<a class="btn btn-primary" style="margin-top:16px" href="cuenta.html">Volver a mis pedidos</a></div>';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const id = akQueryParam('id');
    if (!id) {
      window.location.href = 'cuenta.html';
      return;
    }
    const client = akSupabase();
    const { data: { user } } = await client.auth.getUser();
    if (!user) {
      window.location.href = 'login.html?redirect=' + encodeURIComponent('seguimiento.html?id=' + id);
      return;
    }
    const { data: pedido } = await client
      .from('tienda_pedidos')
      .select('*')
      .eq('id', id)
      .maybeSingle();
    if (!pedido) {
      renderNoEncontrado();
      return;
    }
    const { data: lineas } = await client
      .from('tienda_pedido_lineas')
      .select('*')
      .eq('pedido_id', id)
      .order('created_at', { ascending: true });
    renderPedido(pedido, lineas || []);
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
