    'reparacion-ecu': { title: 'Reparación electrónica de centralitas de motor', intro: 'Analizamos averías internas, ausencia de comunicación, daños de alimentación y fallos de memoria en centralitas ECU. El diagnóstico se realiza antes de confirmar la reparación.', items: ['Diagnóstico electrónico y comprobación en banco', 'Reparación a nivel de componente cuando procede', 'Pruebas y garantía según el trabajo realizado'], faq: [['¿Todas las centralitas se pueden reparar?', 'No siempre. El daño físico, la corrosión o una memoria irrecuperable pueden impedirlo; te informaremos tras el diagnóstico.'], ['¿Hay que pagar antes?', 'La solicitud inicial no implica el pago anticipado de la reparación. Confirmamos el presupuesto después de revisar el caso.']] },
    'inmovilizadores': { title: 'Inmovilizadores, IMMO y sistemas de arranque', intro: 'Soluciones para fallos de inmovilizador, pérdida de sincronización, sustitución de módulos y vehículos que no reconocen la llave.', items: ['Diagnóstico de sistemas de inmovilizador', 'Sincronización entre ECU, inmovilizador y llaves', 'Programación y recuperación de datos de arranque'], faq: [['¿Podéis trabajar si se han perdido todas las llaves?', 'Depende del vehículo y del sistema. Indica marca, modelo, año y módulos disponibles para valorar el procedimiento.'], ['¿Necesitáis llave y módulos?', 'En algunos casos sí. Nunca envíes elementos adicionales hasta que confirmemos exactamente qué necesitamos.']] },
    'bmw-fem-bdc': { title: 'BMW FEM y BDC: reparación, clonación y programación', intro: 'Servicio especializado para módulos FEM y BDC de BMW, incluyendo diagnóstico, recuperación, sincronización y trabajos relacionados con llaves y arranque.', items: ['Comprobación de FEM/BDC y datos de inmovilizador', 'Clonación o sustitución mediante unidad compatible', 'Programación de llaves y sincronización cuando procede'], faq: [['¿Debo enviar la FEM/BDC y la llave?', 'Depende del trabajo solicitado. Revisamos el caso y te confirmamos el material necesario antes del envío.'], ['¿Trabajáis módulos bloqueados o manipulados?', 'Sí, siempre que el estado de la unidad permita recuperar o reconstruir los datos necesarios.']] },
    'bmw-cas-ews': { title: 'BMW CAS y EWS: llaves, clonación y sincronización', intro: 'Diagnóstico y programación de sistemas CAS/EWS para problemas de arranque, pérdida total de llaves, sustitución de módulos y recuperación de datos.', items: ['CAS, EWS y sincronización con la ECU', 'Programación de llaves y recuperación de datos', 'Sustitución y clonación según compatibilidad'], faq: [['¿Se puede añadir una llave por volcado?', 'En muchos sistemas sí, dependiendo de la versión del módulo y del estado de sus memorias.'], ['¿Qué información necesitáis?', 'Marca, modelo, año, referencia del módulo y una descripción clara del problema de arranque.']] },
    'mercedes-ezs-elv': { title: 'Mercedes EZS y ELV: reparación y sustitución', intro: 'Servicios para fallos de arranque, bloqueo de dirección, EZS/EIS y ELV/ESL en vehículos Mercedes-Benz.', items: ['Diagnóstico de EZS/EIS y bloqueo electrónico de dirección', 'Clonación o sustitución mediante donante compatible', 'Soluciones con reparación o emulador cuando sean adecuadas'], faq: [['¿Necesitáis la llave?', 'Con frecuencia sí, pero depende del sistema. Confirma el caso antes de enviar la unidad.'], ['¿Un emulador siempre es la mejor solución?', 'No. Valoramos reparación, sustitución o emulación según vehículo, avería y uso previsto.']] },
    'audi-j518-elv': { title: 'Audi J518 y ELV para vehículos del grupo VAG', intro: 'Diagnóstico, clonación, reparación, sustitución mediante donante e instalación de emulador para módulos J518 y sistemas ELV del grupo VAG.', items: ['Lectura y recuperación de datos del J518 original', 'Clonación o adaptación de módulo donante', 'Reparación o emulación según la avería'], faq: [['¿Este servicio sirve para cualquier marca?', 'La categoría J518/ELV está orientada específicamente a vehículos del grupo VAG compatibles.'], ['¿Debo enviar la llave y el módulo donante?', 'Te indicaremos los elementos exactos después de revisar referencias y síntomas.']] },
    'abs-esp': { title: 'Reparación y clonación de módulos ABS y ESP', intro: 'Analizamos módulos ABS/ESP con fallos electrónicos, problemas de comunicación y necesidad de sustitución o clonación.', items: ['Diagnóstico electrónico del módulo', 'Reparación o clonación mediante donante', 'Codificación y adaptación cuando sean necesarias'], faq: [['¿Se repara también la parte hidráulica?', 'El servicio depende del modelo y del tipo de avería. Describe los síntomas y códigos para confirmar el alcance.'], ['¿Necesitáis la referencia completa?', 'Sí. Una fotografía clara de la etiqueta y los códigos de diagnosis ayuda a comprobar compatibilidad.']] },
    'airbag-srs': { title: 'Módulos Airbag y SRS: crash data y reparación', intro: 'Servicios electrónicos para módulos SRS, borrado de datos de impacto, clonación, diagnóstico y recuperación cuando el estado de la unidad lo permite.', items: ['Lectura y análisis del módulo SRS', 'Borrado de crash data según unidad', 'Clonación o reparación electrónica'], faq: [['¿Basta con enviar el módulo?', 'Habitualmente sí, aunque antes debemos confirmar la referencia y el trabajo requerido.'], ['¿El servicio sustituye la reparación del sistema de seguridad?', 'No. El vehículo debe ser revisado y reparado completamente por un profesional antes de volver a circular.']] },
    'tcu-tcm': { title: 'TCU y TCM de cajas automáticas', intro: 'Diagnóstico, clonación, recuperación de datos y programación de unidades de control de transmisiones automáticas.', items: ['Lectura y comprobación de la unidad original', 'Clonación a donante compatible', 'Programación y adaptación según fabricante'], faq: [['¿Cualquier TCU puede clonarse?', 'No. Es necesario revisar referencias y familia electrónica antes de confirmar compatibilidad.'], ['¿Hace falta adaptar después en el vehículo?', 'Algunos modelos requieren codificación, aprendizaje o adaptación posterior. Te lo indicaremos en el presupuesto.']] },
    'modulos': { title: 'Módulos de confort, UCH y BCM', intro: 'Reparación, clonación, sincronización y sustitución de módulos de carrocería y confort para diferentes fabricantes.', items: ['UCH, BCM, BSI y módulos de confort', 'Recuperación y transferencia de configuraciones', 'Diagnóstico de fallos de comunicación y alimentación'], faq: [['¿Qué módulos debo enviar?', 'Depende de la arquitectura del vehículo. No desmontes ni envíes unidades adicionales hasta recibir nuestras indicaciones.'], ['¿Conserva la configuración original?', 'Cuando los datos son recuperables, buscamos mantener codificación, inmovilizador y funciones asociadas.']] }
  };

  const state = {
    cats: new Set(),
    brand: 'all',
    types: new Set(),
    stock: new Set(),
    maxPrice: MAX_PRICE,
    q: '',
    sort: 'popularidad',
    segment: 'servicios',
  };

  const COMMERCIAL_ORDER = [
    'diagnostico-avanzado', 'ecu-uce-diagnostico', 'llaves-copia-programacion',
    'clonacion-ecu-general', 'airbag-srs-reparacion', 'modulos-confort-uch',
    'reparacion-bmw-frm', 'bmw-cas-ews-programacion', 'reparacion-audi-j518-elv',
  ];

  function productSegment(p) {
    if (p.isDigital || p.isSoftware) return 'software';
    return p.isProduct ? 'productos' : 'servicios';
  }

  function initFromURL() {
    const routeCat = location.pathname.match(/^\/categorias\/([^/]+)\/?$/);
    const cat = akQueryParam('cat') || (routeCat ? decodeURIComponent(routeCat[1]) : '');
    const brand = akQueryParam('brand');
    const q = akQueryParam('q');
    const segment = akQueryParam('ver');
    if (cat) state.cats.add(cat);
    if (cat) {
      const categoryProduct = CATALOG.find((p) => p.category === cat);
      if (categoryProduct) state.segment = productSegment(categoryProduct);
    }
    if (brand) state.brand = brand;
    if (q) state.q = q;
    if (['servicios', 'productos', 'software'].includes(segment)) state.segment = segment;
  }

  function counts() {
    const c = { cats: {}, types: {}, stock: {} };
    CATALOG.filter((p) => productSegment(p) === state.segment).forEach((p) => {
      c.cats[p.category] = (c.cats[p.category] || 0) + 1;
      c.types[p.type] = (c.types[p.type] || 0) + 1;
      c.stock[p.stock] = (c.stock[p.stock] || 0) + 1;
    });
    return c;
  }

  function renderFilters() {
    const c = counts();
    const stockLabels = { stock: 'En stock', encargo: 'Por encargo', envio: 'Servicio por envío' };
    document.getElementById('filters').innerHTML =
      '<h4 style="margin-top:0">BUSCAR</h4>' +
      '<input type="text" class="filter-select" data-role="search" aria-label="Buscar en el catálogo" placeholder="ECU, FEM, EZS, airbag..." value="' + (state.q || '').replace(/"/g, '&quot;') + '">' +
      '<h4>CATEGORÍA</h4><div class="filter-group">' +
        '<label class="' + (state.cats.size === 0 ? 'active' : '') + '"><input type="checkbox" data-role="cat-all" ' + (state.cats.size === 0 ? 'checked' : '') + '>Todas las categorías<span class="count">' + CATALOG.filter((p) => productSegment(p) === state.segment).length + '</span></label>' +
        CATEGORIES.filter((cat) => (c.cats[cat.id] || 0) > 0).map((cat) =>
          '<label class="' + (state.cats.has(cat.id) ? 'active' : '') + '"><input type="checkbox" data-role="cat" value="' + cat.id + '" ' + (state.cats.has(cat.id) ? 'checked' : '') + '>' + cat.label + '<span class="count">' + (c.cats[cat.id] || 0) + '</span></label>'
        ).join('') +
      '</div>' +
      '<h4 id="filter-brand-label">MARCA</h4>' +
      '<select class="filter-select" data-role="brand" aria-labelledby="filter-brand-label">' +
        '<option value="all">Todas las marcas</option>' +
        BRANDS.map((b) => '<option value="' + b.id + '" ' + (state.brand === b.id ? 'selected' : '') + '>' + b.label + '</option>').join('') +
      '</select>' +
      '<h4>TIPO DE SERVICIO</h4><div class="filter-group">' +
        SERVICE_TYPES.map((t) =>
          '<label class="' + (state.types.has(t.id) ? 'active' : '') + '"><input type="checkbox" data-role="type" value="' + t.id + '" ' + (state.types.has(t.id) ? 'checked' : '') + '>' + t.label + '<span class="count">' + (c.types[t.id] || 0) + '</span></label>'
        ).join('') +
      '</div>' +
      '<h4 id="filter-price-label">RANGO DE PRECIO</h4>' +
      '<input type="range" min="0" max="' + MAX_PRICE + '" value="' + state.maxPrice + '" data-role="price" aria-labelledby="filter-price-label" aria-valuetext="hasta €' + state.maxPrice + (state.maxPrice >= MAX_PRICE ? '+' : '') + '">' +
      '<div class="range-labels"><span>€0</span><span id="price-label">€' + state.maxPrice + (state.maxPrice >= MAX_PRICE ? '+' : '') + '</span></div>' +
      '<h4>DISPONIBILIDAD</h4><div class="filter-group">' +
        Object.keys(stockLabels).map((s) =>
          '<label class="' + (state.stock.has(s) ? 'active' : '') + '"><input type="checkbox" data-role="stock" value="' + s + '" ' + (state.stock.has(s) ? 'checked' : '') + '>' + stockLabels[s] + '<span class="count">' + (c.stock[s] || 0) + '</span></label>'
        ).join('') +
      '</div>' +
      '<button class="btn btn-secondary btn-block" data-role="clear" style="margin-top:22px">Limpiar filtros ' + '</button>';
    akFillIcons(document.getElementById('filters'));
  }

  function filteredSorted() {
    let list = CATALOG.filter((p) => {
      if (productSegment(p) !== state.segment) return false;
      if (state.cats.size > 0 && !state.cats.has(p.category)) return false;
      if (state.brand !== 'all' && p.brand !== state.brand && p.brand !== 'multi') return false;
      if (state.types.size > 0 && !state.types.has(p.type)) return false;
      if (state.stock.size > 0 && !state.stock.has(p.stock)) return false;
      if (p.priceFrom > state.maxPrice) return false;
      if (state.q) {
        const hay = (p.name + ' ' + p.shortDesc + ' ' + (p.keywords || []).join(' ')).toLowerCase();
        if (!hay.includes(state.q.toLowerCase())) return false;
      }
      return true;
    });
    if (state.sort === 'precio-asc') list.sort((a, b) => a.priceFrom - b.priceFrom);
    else if (state.sort === 'precio-desc') list.sort((a, b) => b.priceFrom - a.priceFrom);
    else if (state.sort === 'nombre') list.sort((a, b) => a.name.localeCompare(b.name));
    else list.sort((a, b) => {
      const ai = COMMERCIAL_ORDER.indexOf(a.id);
      const bi = COMMERCIAL_ORDER.indexOf(b.id);
      if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      return b.popularity - a.popularity;
    });
    return list;
  }

  function renderGrid() {
    const list = filteredSorted();
    document.getElementById('result-count').textContent =
      list.length + (list.length === 1 ? ' resultado' : ' resultados');
    const grid = document.getElementById('store-grid');
    if (list.length === 0) {
      grid.innerHTML = '';
      grid.insertAdjacentHTML('afterend',
        '<div class="empty-state" id="empty-msg">' + akIcon('search') +
        '<h3>No hay resultados</h3><p>Prueba a quitar algún filtro o buscar con otras palabras.</p></div>');
      return;
    }
    const prevEmpty = document.getElementById('empty-msg');
    if (prevEmpty) prevEmpty.remove();
    grid.innerHTML = list.map((p) =>
      '<article class="product-card">' +
        '<div class="product-media hex-overlay">' + (p.badge ? '<span class="tag">' + p.badge + '</span>' : '') + (p.stock === 'encargo' && !/bajo pedido/i.test(p.badge || '') ? '<span class="tag-encargo">Bajo pedido</span>' : (akStockUrgencia(p) ? '<span class="tag-stock">' + akStockUrgencia(p) + '</span>' : '')) + (p.image ? '<img class="pm-photo" src="' + p.image + '" alt="' + p.name + '" loading="lazy">' : '<span class="ph">' + akIcon(p.icon) + '</span>') + '</div>' +
        '<div class="product-body">' +
          '<div class="product-cat">' + (akFindCategory(p.category) || {}).label + '</div>' +
          '<h3>' + p.name + '</h3>' +
          (akStarsHtml(p.rating, p.ratingCount) ? '<div>' + akStarsHtml(p.rating, p.ratingCount) + '</div>' : '') +
          '<p>' + p.features.slice(0, 3).map((f) => '<span style="display:flex;align-items:center;gap:6px;margin-bottom:3px">' + akIcon('check') + f + '</span>').join('') + '</p>' +
          '<div class="product-price-row">' +
            '<div class="price-block"><small>' + (p.digitalFree ? 'DESCARGA' : 'DESDE') + '</small><b>' + (p.digitalFree ? 'Gratis' : akFormatPrice(p.priceFrom)) + '</b></div>' +
            '<a class="btn btn-primary btn-sm" href="/' + (p.isProduct ? 'productos/' : 'servicios/') + encodeURIComponent(p.id) + '">' + (p.isProduct ? 'Ver producto' : 'Ver servicio') + '</a>' +
          '</div>' +
        '</div>' +
      '</article>'
    ).join('');
  }

  function render() {
    document.querySelectorAll('[data-segment]').forEach((button) => {
      const active = button.dataset.segment === state.segment;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
    });
    renderFilters();
    renderGrid();
  }

  function renderSeoCategoria() {
    // El canonical solo refleja la categoría cuando la URL trae exactamente
    // un ?cat= (el mismo formato que genera el sitemap) — con varios filtros
    // combinados por el usuario, la página sigue canonicalizando a sí misma
    // sin parámetros, ya que la URL nunca cambia al filtrar.
    const routeCat = location.pathname.match(/^\/categorias\/([^/]+)\/?$/);
    const catId = akQueryParam('cat') || (routeCat ? decodeURIComponent(routeCat[1]) : '');
    if (!catId) return;
    const cat = akFindCategory(catId);
    if (!cat) return;
    const url = 'https://www.autokeysremapspro.es/categorias/' + encodeURIComponent(catId);
    const title = cat.label + ' — Autokeys Remaps Pro Store';
    const desc = 'Servicios de ' + cat.label.toLowerCase() + ' en Autokeys Remaps Pro Store: profesionales, con garantía y envío a toda España.';
    document.getElementById('page-title').textContent = title;
    document.getElementById('meta-description').setAttribute('content', desc);
    document.getElementById('link-canonical').setAttribute('href', url);
    document.getElementById('meta-og-title').setAttribute('content', title);
    document.getElementById('meta-og-description').setAttribute('content', desc);
    document.getElementById('meta-og-url').setAttribute('content', url);
    document.getElementById('meta-twitter-title').setAttribute('content', title);
    document.getElementById('meta-twitter-description').setAttribute('content', desc);
    renderCategoryContent(catId, cat);
  }

  function renderCategoryContent(catId, cat) {
    const content = CATEGORY_CONTENT[catId];
    const root = document.getElementById('category-seo-content');
    if (!content) { root.hidden = true; root.innerHTML = ''; return; }
    root.hidden = false;
    root.innerHTML = '<div class="eyebrow">INFORMACIÓN ESPECIALIZADA</div><h2>' + content.title + '</h2><p class="category-seo-intro">' + content.intro + '</p><div class="category-seo-grid"><div><h3>Cómo podemos ayudarte</h3><ul>' + content.items.map((item) => '<li>' + akIcon('check') + '<span>' + item + '</span></li>').join('') + '</ul><a class="btn btn-primary" href="enviar-reparacion.html">Solicitar revisión</a></div><div><h3>Preguntas frecuentes</h3>' + content.faq.map((item) => '<details><summary>' + item[0] + '</summary><p>' + item[1] + '</p></details>').join('') + '</div></div><p class="category-seo-foot">Trabajamos desde nuestro laboratorio en Puente de Génave (Jaén) y atendemos solicitudes de toda España.</p>';
    akFillIcons(root);
  }

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('result-count').textContent = 'Cargando servicios…';
    document.getElementById('store-grid').innerHTML = '<div class="catalog-loading" role="status"><span class="catalog-spinner" aria-hidden="true"></span><b>Preparando el catálogo</b><small>Estamos cargando servicios, opciones y precios actualizados.</small></div>';
    await akCatalogReady();
    if (!CATALOG.length) {
      document.getElementById('result-count').textContent = 'Catálogo no disponible';
      document.getElementById('store-grid').innerHTML = '<div class="empty-state"><h3>No hemos podido cargar el catálogo</h3><p>La conexión está tardando más de lo normal. Puedes reintentarlo sin perder ningún dato.</p><button class="btn btn-primary" type="button" onclick="location.reload()">Reintentar</button></div>';
      return;
    }
    MAX_PRICE = Math.max(1, ...CATALOG.map((p) => p.priceFrom)) + 1;
    state.maxPrice = MAX_PRICE;
    initFromURL();
    renderSeoCategoria();
    render();

    document.getElementById('sort-select').addEventListener('change', (e) => {
      state.sort = e.target.value;
      renderGrid();
    });
    const filtersToggle = document.getElementById('filters-toggle');
    const filtersPanel = document.getElementById('filters');
    function setFiltersOpen(open) {
      filtersPanel.classList.toggle('open', open);
      filtersToggle.setAttribute('aria-expanded', String(open));
      filtersToggle.querySelector('span:last-child').textContent = open ? 'Ocultar filtros' : 'Filtros';
    }
    function closeFiltersOnMobile() {
      if (window.innerWidth <= 980) setFiltersOpen(false);
    }
    filtersToggle.addEventListener('click', () => setFiltersOpen(!filtersPanel.classList.contains('open')));
    document.querySelectorAll('[data-segment]').forEach((button) => button.addEventListener('click', () => {
      state.segment = button.dataset.segment;
      state.cats.clear();
      state.types.clear();
      state.stock.clear();
      const url = new URL(location.href);
      url.searchParams.set('ver', state.segment);
      url.searchParams.delete('cat');
      history.replaceState({}, '', url);
      render();
    }));

    document.body.addEventListener('change', (e) => {
      const role = e.target.dataset.role;
      if (!role) return;
      if (role === 'cat-all') {
        state.cats.clear();
        render();
        closeFiltersOnMobile();
      } else if (role === 'cat') {
        e.target.checked ? state.cats.add(e.target.value) : state.cats.delete(e.target.value);
        render();
        closeFiltersOnMobile();
      } else if (role === 'brand') {
        state.brand = e.target.value;
        render();
      } else if (role === 'type') {
        e.target.checked ? state.types.add(e.target.value) : state.types.delete(e.target.value);
        render();
      } else if (role === 'stock') {
        e.target.checked ? state.stock.add(e.target.value) : state.stock.delete(e.target.value);
        render();
      }
    });

    document.body.addEventListener('input', (e) => {
      if (e.target.dataset.role === 'price') {
        state.maxPrice = Number(e.target.value);
        const priceText = '€' + state.maxPrice + (state.maxPrice >= MAX_PRICE ? '+' : '');
        const label = document.getElementById('price-label');
        if (label) label.textContent = priceText;
        e.target.setAttribute('aria-valuetext', 'hasta ' + priceText);
        renderGrid();
      } else if (e.target.dataset.role === 'search') {
        state.q = e.target.value;
        renderGrid();
      }
    });

    document.body.addEventListener('click', (e) => {
      if (e.target.closest('[data-role="clear"]')) {
        state.cats.clear(); state.brand = 'all'; state.types.clear(); state.stock.clear();
        state.maxPrice = MAX_PRICE; state.q = '';
        render();
      }
    });
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
