<script defer>
  function formatFecha(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function loadPosts() {
    const { data, error } = await akSupabase()
      .from('tienda_blog_posts')
      .select('slug, titulo, resumen, imagen_url, categoria, publicado_en')
      .eq('publicado', true)
      .order('publicado_en', { ascending: false });
    const grid = document.getElementById('blog-grid');
    if (error || !data || data.length === 0) {
      grid.insertAdjacentHTML('afterend',
        '<div class="blog-empty">' + akIcon('file') + '<p style="margin-top:10px">Todavía no hay artículos publicados. Vuelve pronto.</p></div>');
      return;
    }
    grid.innerHTML = data.map((p) =>
      '<a class="blog-card" href="blog-post.html?slug=' + encodeURIComponent(p.slug) + '">' +
        '<div class="blog-card-media">' + (p.imagen_url ? '<img src="' + p.imagen_url + '" alt="' + akEscapeHtml(p.titulo) + '" loading="lazy">' : '<div style="display:grid;place-items:center;height:100%;color:#54545c">' + akIcon('file') + '</div>') + '</div>' +
        '<div class="blog-card-body">' +
          (p.categoria ? '<span class="blog-cat">' + akEscapeHtml(p.categoria) + '</span>' : '') +
          '<h3>' + akEscapeHtml(p.titulo) + '</h3>' +
          '<p>' + akEscapeHtml(p.resumen || '') + '</p>' +
          '<div class="blog-meta">' + akIcon('calendar') + '<span>' + formatFecha(p.publicado_en) + '</span></div>' +
        '</div>' +
      '</a>'
    ).join('');
  }

  document.addEventListener('DOMContentLoaded', loadPosts);
</script>
